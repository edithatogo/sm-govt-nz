name: Setup Python and uv
description: Set up Python 3.14, install uv, and optionally install requirements.

inputs:
  requirements:
    description: Requirements file to install with uv.
    required: false
    default: ""
  cache:
    description: Cache backend passed to actions/setup-python.
    required: false
    default: "pip"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: "3.14"
        cache: ${{ inputs.cache }}
    - name: Install uv
      shell: bash
      run: python -m pip install uv
    - name: Install Python dependencies
      if: ${{ inputs.requirements != '' }}
      shell: bash
      run: uv pip install --system -r "${{ inputs.requirements }}"
