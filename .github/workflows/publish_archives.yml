name: Publish Archives

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to configured external repositories"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      hf_dataset_name:
        description: "Dataset slug to use when HF_DATASET_REPO_ID is not set"
        required: true
        default: "corpus-social-media-government-nz"
      zenodo_deposit_api_url:
        description: "Zenodo depositions API URL used when ZENODO_DEPOSIT_ENDPOINT is not set"
        required: true
        default: "https://zenodo.org/api/deposit/depositions"
        type: string
      archive_release_version:
        description: "Archive release version, normally YYYY-MM. Defaults to current UTC month."
        required: false
        default: ""
        type: string
      publication_target:
        description: "External publication target when publish=true"
        required: true
        default: "all"
        type: choice
        options:
          - "huggingface"
          - "zenodo"
          - "osf"
          - "all"
          - "all_with_osf"
      osf_upload_url:
        description: "OSF file upload base URL used when OSF_UPLOAD_URL is not set"
        required: false
        default: ""
        type: string

  schedule:
    - cron: "41 16 1 * *"

permissions:
  contents: write

concurrency:
  group: archive-state-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  HF_DATASET_NAME: ${{ inputs.hf_dataset_name || 'corpus-social-media-government-nz' }}
  ZENODO_DEPOSIT_API_URL: ${{ inputs.zenodo_deposit_api_url || 'https://zenodo.org/api/deposit/depositions' }}
  ZENODO_PUBLISH: ${{ secrets.ZENODO_PUBLISH || 'true' }}
  ZENODO_CONCEPT_RECORD_ID: ${{ vars.ZENODO_CONCEPT_RECORD_ID || secrets.ZENODO_CONCEPT_RECORD_ID || '20991132' }}
  OSF_UPLOAD_URL: ${{ secrets.OSF_UPLOAD_URL || inputs.osf_upload_url }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
  OSF_TOKEN: ${{ secrets.OSF_TOKEN }}

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: ./.github/actions/setup-python-uv
        with:
          requirements: requirements.txt

      - name: Build archive compaction manifest
        run: >-
          python scripts/build_archive_compaction_manifest.py
          --normalized-dir historical_archive_normalized
          --raw-dir historical_archive_raw
          --output dist/archive_compaction_manifest.json

      - name: Build monthly release plan
        run: >-
          python scripts/build_monthly_release_plan.py
          --normalized-root historical_archive_normalized
          --status-report conductor/archive_publication_status.json
          --ledger conductor/monthly_release_ledger.json
          --output conductor/monthly_release_plan.json
          --summary conductor/monthly_release_plan.md

      - name: Resolve release version
        id: release
        run: |
          if [ -n "${{ inputs.archive_release_version }}" ]; then
            VERSION="${{ inputs.archive_release_version }}"
          else
            VERSION="$(date -u +"%Y-%m")"
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Resolve publication intent
        id: publication
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "publish=${{ inputs.publish }}" >> "${GITHUB_OUTPUT}"
            echo "target=${{ inputs.publication_target }}" >> "${GITHUB_OUTPUT}"
          else
            echo "publish=true" >> "${GITHUB_OUTPUT}"
            echo "target=all" >> "${GITHUB_OUTPUT}"
          fi

      - name: Check monthly publication guard
        id: monthly-publication
        run: >-
          python scripts/monthly_publication_guard.py
          --status-report conductor/archive_publication_status.json
          --ledger conductor/monthly_release_ledger.json
          --release-version "${{ steps.release.outputs.version }}"

      - name: Archive bundle and publish
        run: |
          ARCHIVE_PUBLICATION_TARGET="${{ steps.publication.outputs.target }}"
          STATUS_REPORT="dist/archive_publication_status_artifact.json"
          if [ "${{ steps.publication.outputs.publish }}" = "true" ] && [ "${{ steps.monthly-publication.outputs.should_publish }}" = "true" ]; then
            STATUS_REPORT="conductor/archive_publication_status.json"
          elif [ "${{ steps.publication.outputs.publish }}" = "true" ]; then
            ARCHIVE_PUBLICATION_TARGET="artifact"
            STATUS_REPORT="dist/archive_publication_status_skipped.json"
            echo "External publication already exists for ${{ steps.release.outputs.version }}; building artifact only."
          fi
          base_args=(
            --archive-dir historical_archive
            --normalized-dir historical_archive_normalized
            --raw-dir historical_archive_raw
            --output-dir dist
            --manifest dist/archive_manifest.json
            --status-report "$STATUS_REPORT"
            --release-version "${{ steps.release.outputs.version }}"
          )
          if [ "${{ steps.publication.outputs.publish }}" = "true" ] && [ "${{ steps.monthly-publication.outputs.should_publish }}" = "true" ]; then
            if [ "$ARCHIVE_PUBLICATION_TARGET" != "artifact" ]; then
              echo "Publishing archive bundle to $ARCHIVE_PUBLICATION_TARGET"
            fi
            python scripts/publish_archives.py \
              "${base_args[@]}" \
              --publish \
              --publish-target "$ARCHIVE_PUBLICATION_TARGET"
          else
            python scripts/publish_archives.py "${base_args[@]}"
          fi

      - name: Record published monthly release
        if: ${{ steps.publication.outputs.publish == 'true' && steps.monthly-publication.outputs.should_publish == 'true' }}
        run: >-
          python scripts/record_monthly_release.py
          --status-report conductor/archive_publication_status.json
          --ledger conductor/monthly_release_ledger.json

      - name: Commit publication report
        if: always()
        run: |
          python scripts/commit_state_updates.py \
            --message "Record scheduled publication artifacts and status report" \
            --force \
            --path conductor/archive_publication_status.json \
            --path dist/archive_publication_status_artifact.json \
            --path dist/archive_publication_status_skipped.json \
            --path conductor/monthly_release_ledger.json \
            --path conductor/monthly_release_plan.json \
            --path conductor/monthly_release_plan.md \
            --path dist/archive_manifest.json \
            --path dist/archive_compaction_manifest.json \
            --path dist/corpus_manifest.json \
            --path dist/README.md

      - name: Upload generated corpus bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-social-media-government-nz
          path: |
            dist/archive_manifest.json
            dist/archive_compaction_manifest.json
            conductor/archive_publication_status.json
            dist/archive_publication_status_artifact.json
            dist/archive_publication_status_skipped.json
            conductor/monthly_release_ledger.json
            conductor/monthly_release_plan.json
            conductor/monthly_release_plan.md
            dist/corpus_manifest.json
            dist/README.md
            dist/historical_archive.tar.gz
            dist/historical_archive.jsonl.gz
            dist/normalized_archive.jsonl.gz
            dist/normalized_archive.parquet
