name: Legacy Mirror Follow Audit

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  follow-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-python-uv
        with:
          requirements: requirements.txt
      - name: Refresh follow status cache
        run: python scripts/check_follow_status.py
      - name: Upload follow status report
        uses: actions/upload-artifact@v6
        with:
          name: follow-sync-state
          path: conductor/follow_sync_state.json
      - name: Dry-run supported follow sync
        env:
          BLUESKY_MIRROR_HANDLE: ${{ secrets.BLUESKY_MIRROR_HANDLE }}
        run: python scripts/sync_mirror_follows.py --dry-run
      - name: Explain follow policy
        run: echo "Live following is operator-supervised during onboarding; this legacy workflow is read-only."
