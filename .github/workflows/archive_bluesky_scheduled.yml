name: Archive Bluesky Scheduled

on:
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch:
    inputs:
      agency_id:
        description: "Optional agency ID filter"
        required: false
        default: ""
      dry_run:
        description: "Report without capturing"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      commit_payloads:
        description: "Commit raw/normalized payloads to git"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  archive-bluesky:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"
      - name: Install uv
        run: python -m pip install uv
      - name: Install runtime dependencies
        run: uv pip install --system -r requirements.txt
      - name: Archive Bluesky sources
        run: |
          args=(
            --source-type bluesky
          )
          if [ "${{ inputs.dry_run || 'false' }}" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ -n "${{ inputs.agency_id }}" ]; then
            args+=(--agency-id "${{ inputs.agency_id }}")
          fi
          python -m scripts.archive_registered_sources "${args[@]}"
      - name: Commit Bluesky capture reports
        if: ${{ inputs.dry_run != 'true' }}
        run: >-
          python scripts/commit_state_updates.py
          --message "Capture Bluesky posts from registered government accounts"
          --path conductor/govt_archive_registered_sources_report.json
          --path conductor/archive_state.json
          --path conductor/archive_source_health.json
      - name: Commit Bluesky payloads
        if: ${{ inputs.dry_run != 'true' && inputs.commit_payloads == 'true' }}
        run: >-
          python scripts/commit_state_updates.py
          --message "Archive Bluesky raw and normalized payloads"
          --force
          --path 'historical_archive_raw/bluesky/**'
          --path 'historical_archive_normalized/bluesky/**'
