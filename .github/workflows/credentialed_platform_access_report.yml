name: Credentialed Platform Access Readiness

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Comma-separated credentialed platforms to report"
        required: true
        default: "threads,x,linkedin,facebook,instagram"
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write
  issues: write

concurrency:
  group: credentialed-platform-access-${{ github.ref }}
  cancel-in-progress: false

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      THREADS_API_CAPTURE_ENABLED: ${{ vars.THREADS_API_CAPTURE_ENABLED || 'false' }}
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      X_API_CAPTURE_ENABLED: ${{ vars.X_API_CAPTURE_ENABLED || 'false' }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
      LINKEDIN_API_CAPTURE_ENABLED: ${{ vars.LINKEDIN_API_CAPTURE_ENABLED || 'false' }}
      LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
      FACEBOOK_GRAPH_CAPTURE_ENABLED: ${{ vars.FACEBOOK_GRAPH_CAPTURE_ENABLED || 'false' }}
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      INSTAGRAM_GRAPH_CAPTURE_ENABLED: ${{ vars.INSTAGRAM_GRAPH_CAPTURE_ENABLED || 'false' }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      META_GRAPH_ACCESS_TOKEN: ${{ secrets.META_GRAPH_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"
      - name: Install uv
        run: python -m pip install uv
      - name: Install runtime dependencies
        run: uv pip install --system -r requirements.txt
      - name: Build credentialed platform access report
        run: >-
          python -m scripts.build_credentialed_platform_access_report
          --platforms "${{ inputs.platforms || 'threads,x,linkedin,facebook,instagram' }}"
          --report conductor/credentialed_platform_access_report.json
          --summary conductor/credentialed_platform_access_summary.md
      - name: Commit readiness report
        run: >-
          python scripts/commit_state_updates.py
          --message "Update credentialed platform access readiness report"
          --path conductor/credentialed_platform_access_report.json
          --path conductor/credentialed_platform_access_summary.md
      - name: Open credentialed configuration issue only for enabled gates missing secrets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/credentialed_access_issue.md
          import json
          from pathlib import Path

          report = json.loads(Path("conductor/credentialed_platform_access_report.json").read_text())
          faults = report.get("actionable_configuration_faults", [])
          if not faults:
              raise SystemExit(0)
          print("# Credentialed platform capture configuration fault")
          print()
          print(f"Generated at: {report.get('generated_at', '')}")
          print()
          print("The following live API capture gates are enabled but required repository secrets are missing:")
          print()
          for item in faults:
              print(f"- `{item.get('source_id')}` `{item.get('platform')}` gate `{item.get('gate_variable')}`: missing one required secret set")
          print()
          print("Disabled credentialed gates and missing manual seeds are report-only states and are not blockers.")
          PY
          gh label create credentialed-platform --color 7c3aed --description "Credentialed platform archive capture" || true
          gh label create archive-blocker --color b91c1c --description "Archive workflow blocker requiring operator action" || true
          existing="$(gh issue list --state open --label credentialed-platform --label archive-blocker --json number --jq '.[0].number // empty')"
          if [ -s /tmp/credentialed_access_issue.md ] && [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file /tmp/credentialed_access_issue.md
          elif [ -s /tmp/credentialed_access_issue.md ]; then
            gh issue create \
              --title "Credentialed platform capture enabled without required secrets" \
              --label credentialed-platform \
              --label archive-blocker \
              --body-file /tmp/credentialed_access_issue.md
          elif [ -n "$existing" ]; then
            cat > /tmp/credentialed_access_close.md <<'EOF'
          # Credentialed platform access readiness clear

          No enabled credentialed capture gate is missing its required repository secrets.

          Disabled gates remain report-only states in `conductor/credentialed_platform_access_report.json` and are not workflow blockers.
          EOF
            gh issue comment "$existing" --body-file /tmp/credentialed_access_close.md
            gh issue close "$existing" --reason completed
          fi
