name: Archive Website Scheduled

on:
  schedule:
    - cron: "7 2 * * 0"
  workflow_dispatch:
    inputs:
      agency_id:
        description: "Optional agency ID filter"
        required: false
        default: ""
      dry_run:
        description: "Report without capturing"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      page_limit:
        description: "Max pages to capture per run"
        required: true
        default: "50"
        type: number
      commit_payloads:
        description: "Commit raw/normalized payloads to git"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  archive-website:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"
      - name: Install uv
        run: python -m pip install uv
      - name: Install runtime dependencies
        run: uv pip install --system -r requirements.txt
      - name: Archive website sources
        env:
          AGENCY_ID: ${{ inputs.agency_id }}
          DRY_RUN: ${{ inputs.dry_run }}
          PAGE_LIMIT: ${{ inputs.page_limit }}
        run: |
          page_limit="${PAGE_LIMIT:-50}"
          args=(
            --source-type website_page
            --fetch-timeout 5
            --report conductor/website_archive_report.json
          )
          if [ "$page_limit" != "0" ]; then
            args+=(--limit-sources "$page_limit")
          fi
          if [ "${DRY_RUN:-false}" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ -n "$AGENCY_ID" ]; then
            args+=(--agency-id "$AGENCY_ID")
          fi
          python -m scripts.archive_registered_sources "${args[@]}"
      - name: Commit website dry-run report
        if: ${{ inputs.dry_run == 'true' }}
        run: >-
          python scripts/commit_state_updates.py
          --message "Report website government archive sources"
          --path conductor/website_archive_report.json
      - name: Commit website capture reports
        if: ${{ inputs.dry_run != 'true' }}
        run: >-
          python scripts/build_archive_failure_triage_report.py
          --report conductor/website_archive_report.json
          --output conductor/website_archive_failure_triage_report.json
          &&
          python scripts/build_archive_gap_map.py
          --report conductor/website_archive_report.json
          --output conductor/website_archive_gap_map.json
          &&
          python scripts/commit_state_updates.py
          --message "Capture website pages from registered government sources"
          --path conductor/website_archive_report.json
          --path conductor/website_archive_failure_triage_report.json
          --path conductor/website_archive_gap_map.json
          --path conductor/archive_state.json
          --path conductor/archive_source_health.json
      - name: Commit website payloads
        if: ${{ inputs.dry_run != 'true' && inputs.commit_payloads == 'true' }}
        run: >-
          python scripts/commit_state_updates.py
          --message "Archive website raw HTML and normalized text payloads"
          --force
          --path 'historical_archive_raw/website/**'
          --path 'historical_archive_normalized/website/**'
