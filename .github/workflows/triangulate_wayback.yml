name: Triangulate Sources with Internet Archive

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum source URLs to query"
        required: true
        default: "100"
      offset:
        description: "Offset within the deterministic source shard"
        required: true
        default: "0"
      shard_index:
        description: "Zero-based deterministic shard index"
        required: true
        default: "0"
      shard_count:
        description: "Number of deterministic shards"
        required: true
        default: "1"
      delay:
        description: "Delay between CDX requests in seconds"
        required: true
        default: "0.25"
      retries:
        description: "Maximum attempts for transient provider errors"
        required: true
        default: "3"
      backoff:
        description: "Initial retry backoff in seconds"
        required: true
        default: "1"

permissions:
  contents: write

concurrency:
  group: wayback-triangulation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  triangulate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-python-uv
        with:
          requirements: requirements-dev.txt
      - name: Collect Wayback CDX metadata
        run: >-
          python scripts/triangulate_wayback.py
          --limit "${{ inputs.limit || '100' }}"
          --offset "${{ inputs.offset || '0' }}"
          --shard-index "${{ inputs.shard_index || '0' }}"
          --shard-count "${{ inputs.shard_count || '1' }}"
          --delay "${{ inputs.delay || '0.25' }}"
          --retries "${{ inputs.retries || '3' }}"
          --backoff "${{ inputs.backoff || '1' }}"
      - name: Commit triangulation report
        run: >-
          python scripts/commit_state_updates.py
          --message "Refresh Internet Archive triangulation metadata"
          --path conductor/archive_triangulation_wayback.json
