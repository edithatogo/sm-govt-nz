name: Validate Threads Manual Seeds

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      allow_empty:
        description: "Allow no seed files to be present"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  push:
    paths:
      - "manual_archive_seeds/threads/**"
      - "scripts/validate_threads_manual_seeds.py"

permissions:
  contents: write
  issues: write

jobs:
  validate-threads-seeds:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validate Threads manual seeds
        run: |
          args=()
          if [ "${{ inputs.allow_empty || 'true' }}" = "true" ]; then
            args+=(--allow-empty)
          fi
          python scripts/validate_threads_manual_seeds.py "${args[@]}"
      - name: Build Threads seed readiness report
        run: python scripts/build_threads_seed_readiness_report.py
      - name: Commit validation report
        run: >-
          python scripts/commit_state_updates.py
          --message "Validate Threads manual seed exports"
          --path conductor/threads_manual_seed_validation_report.json
          --path conductor/threads_seed_readiness_report.json
          --path conductor/threads_seed_readiness_summary.md
      - name: Open or update Threads seed readiness issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/threads_seed_issue.md
          import json
          from pathlib import Path

          report = json.loads(Path("conductor/threads_seed_readiness_report.json").read_text())
          actionable = [
              item for item in report.get("items", [])
              if item.get("readiness") in {"seed_empty", "seed_invalid"}
          ]
          if not actionable:
              raise SystemExit(0)
          print("# Threads seed input action required")
          print()
          print(f"Generated at: {report.get('generated_at', '')}")
          print()
          print("The Threads archive automation is configured, but these registered sources have seed files that require correction before archival:")
          print()
          for item in actionable:
              print(f"- `{item.get('source_id')}` @{item.get('handle')} `{item.get('readiness')}`")
              for candidate in item.get("seed_candidates", []):
                  print(f"  - `{candidate}`")
              for result in item.get("validation_results", []):
                  for error in result.get("errors", []):
                      print(f"  - {error}")
          print()
          print("Missing seed files are tracked in conductor reports only. Issues are reserved for present but empty or invalid seed files.")
          PY
          gh label create threads --color 4f46e5 --description "Threads platform archival work" || true
          gh label create archive-input-needed --color f59e0b --description "Archive source needs authorized input data" || true
          existing="$(gh issue list --state open --label threads --label archive-input-needed --json number --jq '.[0].number // empty')"
          if [ -s /tmp/threads_seed_issue.md ] && [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file /tmp/threads_seed_issue.md
          elif [ -s /tmp/threads_seed_issue.md ]; then
            gh issue create \
              --title "Threads seed inputs required for archive automation" \
              --label threads \
              --label archive-input-needed \
              --body-file /tmp/threads_seed_issue.md
          elif [ -n "$existing" ]; then
            printf '%s\n' \
              '# Threads seed readiness: coverage gap tracked automatically' \
              '' \
              'Threads sources are registered and monitored by scheduled workflows.' \
              '' \
              'Current state:' \
              '- No Threads records are archived yet.' \
              '- All three registered Threads accounts currently report `manual_seed_missing`.' \
              '- Missing seed inputs are tracked in `conductor/threads_seed_readiness_report.json` and `conductor/threads_archive_report.json`.' \
              '- `seed_missing` is an expected zero-input coverage gap, not an implementation blocker.' \
              '- Future authorized seed files or API availability will be validated and archived automatically.' \
              '' \
              'Issues will reopen only for actionable automation faults, including present but empty or invalid seed files, workflow failures, or API permission/configuration errors.' \
              > /tmp/threads_seed_close.md
            gh issue comment "$existing" --body-file /tmp/threads_seed_close.md
            gh issue close "$existing" --reason completed
          fi
