name: Archive Registered Sources

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      source_type:
        description: "Which registered sources to archive or report"
        required: true
        default: "all_feasible"
        type: choice
        options:
          - all_feasible
          - rss
          - json_feed
          - website_page
          - social_profile
          - bluesky
          - youtube
          - facebook
          - instagram
          - threads
          - linkedin
          - x
      agency_id:
        description: "Optional agency id filter"
        required: false
        default: ""
      include_blocked:
        description: "Include degraded/manual/blocked records in the report"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      dry_run:
        description: "Report selected sources without capturing"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      limit_sources:
        description: "Maximum selected sources to process; 0 means all"
        required: true
        default: "0"
      offset_sources:
        description: "Number of selected sources to skip before processing"
        required: true
        default: "0"
      fetch_timeout:
        description: "Per-source fetch timeout in seconds"
        required: true
        default: "30"
      publish:
        description: "Publish captured archive bundle after a non-dry-run capture"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      publication_target:
        description: "External publication target when publish=true"
        required: true
        default: "all"
        type: choice
        options:
          - huggingface
          - zenodo
          - osf
          - all
          - all_with_osf
      commit_payloads:
        description: "Commit raw/normalized archive payloads to git after capture"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      osf_upload_url:
        description: "OSF file upload base URL used when OSF_UPLOAD_URL is not set"
        required: false
        default: ""
      hf_dataset_name:
        description: "Dataset slug to use when HF_DATASET_REPO_ID is not set"
        required: true
        default: "corpus-social-media-government-nz"
      zenodo_deposit_api_url:
        description: "Zenodo depositions API URL used when ZENODO_DEPOSIT_ENDPOINT is not set"
        required: true
        default: "https://zenodo.org/api/deposit/depositions"

permissions:
  contents: write

concurrency:
  group: archive-state-${{ github.workflow }}-${{ github.ref }}-${{ inputs.source_type || 'scheduled' }}-${{ inputs.offset_sources || '0' }}
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET_REPO_ID: ${{ secrets.HF_DATASET_REPO_ID }}
      HF_DATASET_NAME: ${{ inputs.hf_dataset_name }}
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
      ZENODO_DEPOSIT_ENDPOINT: ${{ secrets.ZENODO_DEPOSIT_ENDPOINT }}
      ZENODO_DEPOSIT_API_URL: ${{ inputs.zenodo_deposit_api_url }}
      OSF_TOKEN: ${{ secrets.OSF_TOKEN }}
      OSF_UPLOAD_URL: ${{ secrets.OSF_UPLOAD_URL || inputs.osf_upload_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install uv
        run: python -m pip install uv
      - name: Install runtime dependencies
        run: uv pip install --system -r requirements.txt
      - name: Archive registered sources
        run: |
          limit_sources="${{ inputs.limit_sources || '0' }}"
          offset_sources="${{ inputs.offset_sources || '0' }}"
          fetch_timeout="${{ inputs.fetch_timeout || '30' }}"
          args=(
            --source-type "${{ inputs.source_type || 'all_feasible' }}"
            --agency-id "${{ inputs.agency_id || '' }}"
          )
          if [ "$limit_sources" != "0" ]; then
            args+=(--limit-sources "$limit_sources")
          fi
          if [ "$offset_sources" != "0" ]; then
            args+=(--offset-sources "$offset_sources")
          fi
          if [ -n "$fetch_timeout" ]; then
            args+=(--fetch-timeout "$fetch_timeout")
          fi
          if [ "${{ inputs.include_blocked }}" = "true" ]; then
            args+=(--include-blocked)
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args+=(--dry-run)
          fi
          python -m scripts.archive_registered_sources "${args[@]}"
      - name: Build archive compaction manifest
        if: ${{ inputs.dry_run == 'false' }}
        run: >-
          python scripts/build_archive_compaction_manifest.py
          --normalized-dir historical_archive_normalized
          --raw-dir historical_archive_raw
          --output dist/archive_compaction_manifest.json
      - name: Check monthly publication guard
        if: ${{ inputs.dry_run == 'false' }}
        id: monthly-publication
        run: >-
          python scripts/monthly_publication_guard.py
          --status-report conductor/archive_publication_status.json
          --release-version "$(date -u +'%Y-%m')"
      - name: Validate canonical publication status before bundling
        if: ${{ inputs.dry_run == 'false' }}
        run: python scripts/validate_archive_publication_status.py
      - name: Bundle and optionally publish archive corpus
        if: ${{ inputs.dry_run == 'false' }}
        run: |
          publish_target="artifact"
          status_report="dist/archive_publication_status_artifact.json"
          if [ "${{ inputs.publish }}" = "true" ] && [ "${{ steps.monthly-publication.outputs.should_publish }}" = "true" ]; then
            publish_target="${{ inputs.publication_target }}"
            status_report="conductor/archive_publication_status.json"
          elif [ "${{ inputs.publish }}" = "true" ]; then
            status_report="dist/archive_publication_status_skipped.json"
            echo "External publication already exists for ${{ steps.monthly-publication.outputs.release_version }}; building artifact only."
          fi
          args=(
            python scripts/publish_archives.py
            --archive-dir historical_archive
            --normalized-dir historical_archive_normalized
            --raw-dir historical_archive_raw
            --output-dir dist
            --manifest dist/archive_manifest.json
            --status-report "$status_report"
            --publish-target "$publish_target"
            --release-version "${{ steps.monthly-publication.outputs.release_version }}"
          )
          if [ "${{ inputs.publish }}" = "true" ] && [ "${{ steps.monthly-publication.outputs.should_publish }}" = "true" ]; then
            args+=(--publish)
          fi
          "${args[@]}"
      - name: Commit archive report updates
        if: ${{ inputs.dry_run == 'true' }}
        run: >-
          python scripts/commit_state_updates.py
          --message "Report registered government archive sources"
          --path conductor/govt_archive_registered_sources_report.json
          --path conductor/govt_archive_registered_sources_summary.md
      - name: Commit archive capture reports
        if: ${{ inputs.dry_run == 'false' }}
        run: >-
          python scripts/commit_state_updates.py
          --message "Record registered government archive capture report"
          --force
          --max-attempts 10
          --path conductor/govt_archive_registered_sources_report.json
          --path conductor/govt_archive_registered_sources_summary.md
          --path conductor/archive_state.json
          --path conductor/archive_source_health.json
          --path dist/archive_manifest.json
          --path dist/archive_compaction_manifest.json
          --path dist/corpus_manifest.json
          --path dist/README.md
          --path dist/archive_publication_status_artifact.json
          --path dist/archive_publication_status_skipped.json
          --path conductor/archive_publication_status.json
      - name: Commit archive payloads
        if: ${{ inputs.dry_run == 'false' && inputs.commit_payloads == 'true' }}
        run: |
          shopt -s globstar nullglob
          files=(historical_archive_raw/** historical_archive_normalized/**)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No archive payload files to commit."
            exit 0
          fi
          args=(
            python scripts/commit_state_updates.py
            --message "Archive registered government source payloads"
            --force
            --max-attempts 10
          )
          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              args+=(--path "$file")
            fi
          done
          if [ "${#args[@]}" -eq 5 ]; then
            echo "No archive payload files to commit."
            exit 0
          fi
          "${args[@]}"
      - name: Upload generated corpus bundle
        if: ${{ inputs.dry_run == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: registered-government-source-archive-corpus
          path: |
            dist/archive_manifest.json
            dist/archive_compaction_manifest.json
            conductor/archive_publication_status.json
            dist/archive_publication_status_artifact.json
            dist/archive_publication_status_skipped.json
            dist/corpus_manifest.json
            dist/README.md
            dist/historical_archive.tar.gz
            dist/historical_archive.jsonl.gz
            dist/normalized_archive.jsonl.gz
            dist/normalized_archive.parquet
