name: Archive Registered Sources

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      source_type:
        description: "Which registered sources to archive or report"
        required: true
        default: "all_feasible"
        type: choice
        options:
          - all_feasible
          - rss
          - json_feed
          - website_page
          - api
          - api_endpoint
          - social_profile
          - bluesky
          - youtube
          - facebook
          - instagram
          - threads
          - linkedin
          - newsletter
          - x
      agency_id:
        description: "Optional agency id filter"
        required: false
        default: ""
      include_blocked:
        description: "Include degraded/manual/blocked records in the report"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      dry_run:
        description: "Report selected sources without capturing"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      capture_backend:
        description: "Capture backend for eligible source types"
        required: true
        default: "default"
        type: choice
        options:
          - default
          - feed
          - browser
          - browser_and_feed
      x_feed_providers:
        description: "Comma-separated X feed providers when capture_backend=feed or browser_and_feed"
        required: true
        default: "rsshub,nitter"
      x_feed_timeout:
        description: "Per-provider X feed timeout in seconds"
        required: true
        default: "30"
      x_feed_max_items:
        description: "Maximum feed entries to normalize per provider/source"
        required: true
        default: "25"
      newsboat_health_check:
        description: "Optionally validate generated X feed URLs with Newsboat when using feed backends"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      limit_sources:
        description: "Maximum selected sources to process; 0 means all"
        required: true
        default: "0"
      offset_sources:
        description: "Number of selected sources to skip before processing"
        required: true
        default: "0"
      fetch_timeout:
        description: "Per-source fetch timeout in seconds"
        required: true
        default: "30"
      max_x_posts:
        description: "Maximum recent X posts to request per account when X API capture is explicitly enabled"
        required: true
        default: "25"
      max_scrolls:
        description: "Maximum browser scroll rounds per X account when capture_backend=browser"
        required: true
        default: "25"
      idle_rounds:
        description: "Stop browser capture after this many scroll rounds without new visible X posts"
        required: true
        default: "3"
      per_account_timeout:
        description: "Maximum seconds per X account when capture_backend=browser"
        required: true
        default: "120"
      publish:
        description: "Publish captured archive bundle after a non-dry-run capture"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      publication_target:
        description: "External publication target when publish=true"
        required: true
        default: "all"
        type: choice
        options:
          - huggingface
          - zenodo
          - osf
          - all
          - all_with_osf
      commit_payloads:
        description: "Commit raw/normalized archive payloads to git after capture"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      osf_upload_url:
        description: "OSF file upload base URL used when OSF_UPLOAD_URL is not set"
        required: false
        default: ""
      hf_dataset_name:
        description: "Dataset slug to use when HF_DATASET_REPO_ID is not set"
        required: true
        default: "corpus-social-media-government-nz"
      zenodo_deposit_api_url:
        description: "Zenodo depositions API URL used when ZENODO_DEPOSIT_ENDPOINT is not set"
        required: true
        default: "https://zenodo.org/api/deposit/depositions"

permissions:
  contents: write

concurrency:
  group: archive-state-${{ github.workflow }}-${{ github.ref }}-${{ inputs.source_type || 'scheduled' }}-${{ inputs.offset_sources || '0' }}
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET_REPO_ID: ${{ secrets.HF_DATASET_REPO_ID }}
      HF_DATASET_NAME: ${{ inputs.hf_dataset_name }}
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
      ZENODO_DEPOSIT_ENDPOINT: ${{ secrets.ZENODO_DEPOSIT_ENDPOINT }}
      ZENODO_DEPOSIT_API_URL: ${{ inputs.zenodo_deposit_api_url }}
      OSF_TOKEN: ${{ secrets.OSF_TOKEN }}
      OSF_UPLOAD_URL: ${{ secrets.OSF_UPLOAD_URL || inputs.osf_upload_url }}
      X_API_CAPTURE_ENABLED: ${{ vars.X_API_CAPTURE_ENABLED || 'false' }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
      X_API_BASE_URL: ${{ vars.X_API_BASE_URL || 'https://api.x.com/2' }}
      X_PUBLIC_SNAPSHOT_ENABLED: ${{ vars.X_PUBLIC_SNAPSHOT_ENABLED || 'true' }}
      X_FEED_PROVIDERS: ${{ vars.X_FEED_PROVIDERS || inputs.x_feed_providers || 'rsshub,nitter' }}
      RSSHUB_BASE_URLS: ${{ vars.RSSHUB_BASE_URLS || 'https://rsshub.app' }}
      NITTER_BASE_URLS: ${{ vars.NITTER_BASE_URLS || 'https://xcancel.com,https://nitter.poast.org,https://nitter.privacyredirect.com,https://lightbrd.com,https://nitter.space,https://nitter.tiekoetter.com,https://nuku.trabun.org,https://nitter.catsarch.com,https://nitter.kareem.one,https://nt.vern.cc' }}
      X_FEED_TIMEOUT: ${{ vars.X_FEED_TIMEOUT || inputs.x_feed_timeout || '30' }}
      X_FEED_MAX_ITEMS: ${{ vars.X_FEED_MAX_ITEMS || inputs.x_feed_max_items || '25' }}
      X_AUTH_SCRAPE_ENABLED: ${{ vars.X_AUTH_SCRAPE_ENABLED || 'false' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-python-uv
        with:
          requirements: requirements.txt
      - name: Install browser runtime dependencies
        if: ${{ inputs.capture_backend == 'browser' || inputs.capture_backend == 'browser_and_feed' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1 libasound2t64
      - name: Install Newsboat for optional X feed health check
        if: ${{ inputs.newsboat_health_check == 'true' && (inputs.capture_backend == 'feed' || inputs.capture_backend == 'browser_and_feed') }}
        run: |
          sudo apt-get update
          sudo apt-get install -y newsboat
      - name: Resolve archive report paths
        run: |
          source_type="${{ inputs.source_type || 'all_feasible' }}"
          offset_sources="${{ inputs.offset_sources || '0' }}"
          capture_backend="${{ inputs.capture_backend || 'default' }}"
          if [ "$source_type" = "x" ] && [ "$capture_backend" = "feed" ]; then
            report_path="conductor/x_feed_archive_report.json"
            summary_path="conductor/x_feed_archive_summary.md"
          elif [ "$source_type" = "x" ] && [ "$capture_backend" = "browser_and_feed" ]; then
            report_path="conductor/x_browser_and_feed_archive_report.json"
            summary_path="conductor/x_browser_and_feed_archive_summary.md"
          elif [ "$source_type" = "all_feasible" ]; then
            report_path="conductor/govt_archive_registered_sources_report.json"
            summary_path="conductor/govt_archive_registered_sources_summary.md"
          else
            safe_source_type="${source_type//[^A-Za-z0-9_]/_}"
            if [ "$offset_sources" != "0" ]; then
              report_path="conductor/${safe_source_type}_archive_offset_${offset_sources}_report.json"
              summary_path="conductor/${safe_source_type}_archive_offset_${offset_sources}_summary.md"
            else
              report_path="conductor/${safe_source_type}_archive_report.json"
              summary_path="conductor/${safe_source_type}_archive_summary.md"
            fi
          fi
          echo "ARCHIVE_REPORT_PATH=$report_path" >> "$GITHUB_ENV"
          echo "ARCHIVE_SUMMARY_PATH=$summary_path" >> "$GITHUB_ENV"
      - name: Archive registered sources
        run: |
          limit_sources="${{ inputs.limit_sources || '0' }}"
          offset_sources="${{ inputs.offset_sources || '0' }}"
          fetch_timeout="${{ inputs.fetch_timeout || '30' }}"
          max_x_posts="${{ inputs.max_x_posts || '25' }}"
          capture_backend="${{ inputs.capture_backend || 'default' }}"
          max_scrolls="${{ inputs.max_scrolls || '25' }}"
          idle_rounds="${{ inputs.idle_rounds || '3' }}"
          per_account_timeout="${{ inputs.per_account_timeout || '120' }}"
          x_feed_providers="${{ inputs.x_feed_providers || 'rsshub,nitter' }}"
          x_feed_timeout="${{ inputs.x_feed_timeout || '30' }}"
          x_feed_max_items="${{ inputs.x_feed_max_items || '25' }}"
          args=(
            --source-type "${{ inputs.source_type || 'all_feasible' }}"
            --agency-id "${{ inputs.agency_id || '' }}"
            --report "$ARCHIVE_REPORT_PATH"
            --summary "$ARCHIVE_SUMMARY_PATH"
            --capture-backend "$capture_backend"
          )
          if [ "$limit_sources" != "0" ]; then
            args+=(--limit-sources "$limit_sources")
          fi
          if [ "$offset_sources" != "0" ]; then
            args+=(--offset-sources "$offset_sources")
          fi
          if [ -n "$fetch_timeout" ]; then
            args+=(--fetch-timeout "$fetch_timeout")
          fi
          if [ -n "$max_x_posts" ]; then
            args+=(--max-x-posts "$max_x_posts")
          fi
          if [ "$capture_backend" = "browser" ]; then
            args+=(--max-scrolls "$max_scrolls")
            args+=(--idle-rounds "$idle_rounds")
            args+=(--per-account-timeout "$per_account_timeout")
          fi
          if [ "$capture_backend" = "browser_and_feed" ]; then
            args+=(--max-scrolls "$max_scrolls")
            args+=(--idle-rounds "$idle_rounds")
            args+=(--per-account-timeout "$per_account_timeout")
          fi
          if [ "$capture_backend" = "feed" ] || [ "$capture_backend" = "browser_and_feed" ]; then
            args+=(--x-feed-providers "$x_feed_providers")
            args+=(--x-feed-timeout "$x_feed_timeout")
            args+=(--x-feed-max-items "$x_feed_max_items")
          fi
          if [ "${{ inputs.include_blocked }}" = "true" ]; then
            args+=(--include-blocked)
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ "$capture_backend" = "browser" ] || [ "$capture_backend" = "browser_and_feed" ]; then
            xvfb-run -a -s "-screen 0 1920x1080x24" python -m scripts.archive_registered_sources "${args[@]}"
          else
            python -m scripts.archive_registered_sources "${args[@]}"
          fi
      - name: Optional Newsboat X feed health check
        if: ${{ inputs.newsboat_health_check == 'true' && (inputs.capture_backend == 'feed' || inputs.capture_backend == 'browser_and_feed') }}
        run: |
          urls="$RUNNER_TEMP/x-feed-urls.txt"
          config="$RUNNER_TEMP/newsboat-config"
          cache="$RUNNER_TEMP/newsboat-cache.db"
          : > "$config"
          python -m scripts.archive_x_feed \
            --dry-run \
            --limit-sources "${{ inputs.limit_sources || '0' }}" \
            --offset-sources "${{ inputs.offset_sources || '0' }}" \
            --x-feed-providers "${{ inputs.x_feed_providers || 'rsshub,nitter' }}" \
            --rsshub-base-urls "$RSSHUB_BASE_URLS" \
            --nitter-base-urls "$NITTER_BASE_URLS" \
            --newsboat-url-file "$urls"
          if [ -s "$urls" ]; then
            newsboat -u "$urls" -c "$cache" -C "$config" -x reload
          else
            echo "No X feed URLs generated for Newsboat health check."
          fi
      - name: Build archive compaction manifest
        if: ${{ inputs.dry_run == 'false' }}
        run: >-
          python scripts/build_archive_compaction_manifest.py
          --normalized-dir historical_archive_normalized
          --raw-dir historical_archive_raw
          --output dist/archive_compaction_manifest.json
      - name: Check monthly publication guard
        if: ${{ inputs.dry_run == 'false' }}
        id: monthly-publication
        run: >-
          python scripts/monthly_publication_guard.py
          --status-report conductor/archive_publication_status.json
          --release-version "$(date -u +'%Y-%m')"
      - name: Validate canonical publication status before bundling
        if: ${{ inputs.dry_run == 'false' }}
        run: python scripts/validate_archive_publication_status.py
      - name: Bundle and optionally publish archive corpus
        if: ${{ inputs.dry_run == 'false' }}
        run: |
          publish_target="artifact"
          status_report="dist/archive_publication_status_artifact.json"
          if [ "${{ inputs.publish }}" = "true" ] && [ "${{ steps.monthly-publication.outputs.should_publish }}" = "true" ]; then
            publish_target="${{ inputs.publication_target }}"
            status_report="conductor/archive_publication_status.json"
          elif [ "${{ inputs.publish }}" = "true" ]; then
            status_report="dist/archive_publication_status_skipped.json"
            echo "External publication already exists for ${{ steps.monthly-publication.outputs.release_version }}; building artifact only."
          fi
          args=(
            python scripts/publish_archives.py
            --archive-dir historical_archive
            --normalized-dir historical_archive_normalized
            --raw-dir historical_archive_raw
            --output-dir dist
            --manifest dist/archive_manifest.json
            --status-report "$status_report"
            --publish-target "$publish_target"
            --release-version "${{ steps.monthly-publication.outputs.release_version }}"
          )
          if [ "${{ inputs.publish }}" = "true" ] && [ "${{ steps.monthly-publication.outputs.should_publish }}" = "true" ]; then
            args+=(--publish)
          fi
          "${args[@]}"
      - name: Commit archive report updates
        if: ${{ inputs.dry_run == 'true' }}
        run: >-
          python scripts/commit_state_updates.py
          --message "Report registered government archive sources"
          --path "$ARCHIVE_REPORT_PATH"
          --path "$ARCHIVE_SUMMARY_PATH"
      - name: Commit archive capture reports
        if: ${{ inputs.dry_run == 'false' }}
        run: >-
          python scripts/commit_state_updates.py
          --message "Record registered government archive capture report"
          --force
          --max-attempts 10
          --path "$ARCHIVE_REPORT_PATH"
          --path "$ARCHIVE_SUMMARY_PATH"
          --path conductor/archive_state.json
          --path conductor/archive_source_health.json
          --path dist/archive_manifest.json
          --path dist/archive_compaction_manifest.json
          --path dist/corpus_manifest.json
          --path dist/README.md
          --path dist/archive_publication_status_artifact.json
          --path dist/archive_publication_status_skipped.json
          --path conductor/archive_publication_status.json
      - name: Commit archive payloads
        if: ${{ inputs.dry_run == 'false' && inputs.commit_payloads == 'true' }}
        run: |
          shopt -s globstar nullglob
          files=(historical_archive_raw/** historical_archive_normalized/**)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No archive payload files to commit."
            exit 0
          fi
          args=(
            python scripts/commit_state_updates.py
            --message "Archive registered government source payloads"
            --force
            --max-attempts 10
          )
          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              args+=(--path "$file")
            fi
          done
          if [ "${#args[@]}" -eq 5 ]; then
            echo "No archive payload files to commit."
            exit 0
          fi
          "${args[@]}"
      - name: Upload generated corpus bundle
        if: ${{ inputs.dry_run == 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: registered-government-source-archive-corpus
          path: |
            dist/archive_manifest.json
            dist/archive_compaction_manifest.json
            conductor/archive_publication_status.json
            dist/archive_publication_status_artifact.json
            dist/archive_publication_status_skipped.json
            dist/corpus_manifest.json
            dist/README.md
            dist/historical_archive.tar.gz
            dist/historical_archive.jsonl.gz
            dist/normalized_archive.jsonl.gz
            dist/normalized_archive.parquet
