name: Archive Sources

on:
  schedule:
    - cron: "7 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive-sources:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"
      - name: Install uv
        run: python -m pip install uv
      - name: Install runtime dependencies
        run: uv pip install --system -r requirements.txt
      - name: Archive current public sources
        run: python scripts/archive_current_sources.py --website-limit 10
      - name: Commit archive updates
        run: >-
          python scripts/commit_state_updates.py
          --message "Update archive source captures"
          --force
          --path conductor/archive_state.json
          --path conductor/archive_source_health.json
          --path 'historical_archive_raw/**'
          --path 'historical_archive_normalized/**'
