name: Triangulate Sources with Common Crawl

on:
  schedule:
    - cron: "37 5 * * 1"
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum source URLs to query"
        required: true
        default: "100"
      delay:
        description: "Delay between index requests in seconds"
        required: true
        default: "0.25"

permissions:
  contents: write

concurrency:
  group: common-crawl-triangulation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  triangulate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-python-uv
        with:
          requirements: requirements-dev.txt
      - name: Collect Common Crawl index metadata
        run: >-
          python scripts/triangulate_common_crawl.py
          --limit "${{ inputs.limit || '100' }}"
          --delay "${{ inputs.delay || '0.25' }}"
      - name: Commit triangulation report
        run: >-
          python scripts/commit_state_updates.py
          --message "Refresh Common Crawl triangulation metadata"
          --path conductor/archive_triangulation_common_crawl.json
