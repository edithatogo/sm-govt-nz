name: Bluesky Mirror Cleanup Apply

on:
  workflow_dispatch:
    inputs:
      mirror_id:
        description: "Canonical mirror ID."
        required: true
        type: string
      approved_uris_json:
        description: "Exact approved AT URI JSON array."
        required: true
        type: string
      apply:
        description: "Delete visible approved records."
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: bluesky-mirror-cleanup-apply-${{ inputs.mirror_id }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has_targets: ${{ steps.matrix.outputs.has_targets }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-python-uv
        with:
          requirements: requirements.txt
      - id: matrix
        env:
          MIRROR_ID: ${{ inputs.mirror_id }}
        run: python scripts/manage_bluesky_mirror_programme.py matrix --mode health --mirror-id "$MIRROR_ID" --github-output

  apply:
    if: ${{ needs.plan.outputs.has_targets == 'true' }}
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-python-uv
        with:
          requirements: requirements.txt
      - env:
          APPLY_CHANGES: ${{ inputs.apply }}
          APPROVED_URIS_JSON: ${{ inputs.approved_uris_json }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MIRROR_ID: ${{ matrix.mirror_id }}
        run: |
          args=(
            python scripts/apply_bluesky_mirror_cleanup.py
            --mirror-id "$MIRROR_ID"
            --report "conductor/bluesky_mirror_cleanup/$MIRROR_ID.json"
            --approved-uris-json "$APPROVED_URIS_JSON"
            --output "conductor/bluesky_mirror_cleanup_apply/$MIRROR_ID.json"
          )
          if [ "$APPLY_CHANGES" = "true" ]; then
            args+=(--apply)
          fi
          "${args[@]}"
      - run: python scripts/verify_archive_mirror_posts.py --reconcile-programme --mirror-id '${{ matrix.mirror_id }}' --audit-path conductor/bluesky_mirror_post_audit.jsonl --audit-path conductor/bluesky_mirror_audit --output 'conductor/bluesky_mirror_cleanup/${{ matrix.mirror_id }}.json' --json --report-only
      - run: python scripts/commit_state_updates.py --message "Record Bluesky cleanup apply (${{ matrix.mirror_id }})" --path "conductor/bluesky_mirror_cleanup_apply/${{ matrix.mirror_id }}.json" --path "conductor/bluesky_mirror_cleanup/${{ matrix.mirror_id }}.json"
