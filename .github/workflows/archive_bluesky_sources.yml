name: Archive Bluesky Sources

on:
  workflow_dispatch:
    inputs:
      source_limit:
        description: "Maximum Bluesky sources to archive in this run"
        required: false
        default: ""
      dry_run:
        description: "Run discovery/archive logic without committing state"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    - cron: "17 14 * * *"

permissions:
  contents: write

concurrency:
  group: archive-bluesky-sources
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
  BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
  BSKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
  BSKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}

jobs:
  archive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv
        run: python -m pip install uv

      - name: Install dependencies
        run: uv pip install --system -r requirements.txt

      - name: Archive registered Bluesky sources
        run: |
          args=(
            --source-type bluesky
            --raw-root historical_archive_raw
            --normalized-root historical_archive_normalized
            --report conductor/archive_source_health.json
          )
          if [ -n "${{ inputs.source_limit }}" ]; then
            args+=(--limit-sources "${{ inputs.source_limit }}")
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args+=(--dry-run)
          fi
          python scripts/archive_registered_sources.py "${args[@]}"

      - name: Commit Bluesky archive state
        if: ${{ always() && inputs.dry_run != 'true' }}
        run: |
          python scripts/commit_state_updates.py \
            --message "Archive registered Bluesky sources" \
            --path historical_archive \
            --path historical_archive_normalized \
            --path historical_archive_raw \
            --path conductor/archive_state.json \
            --path conductor/archive_source_health.json

      - name: Upload Bluesky archive diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bluesky-archive-diagnostics
          path: |
            conductor/archive_state.json
            conductor/archive_source_health.json
