name: Manual/API Source Onboarding

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: "Comma-separated non-live-capturable platforms to report"
        required: true
        default: "facebook,instagram,threads,linkedin,x,newsletter"
      commit_report:
        description: "Commit the refreshed onboarding report"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      next_batch_limit:
        description: "Number of sources to include in the deterministic next batch"
        required: true
        default: "25"
  schedule:
    - cron: "42 15 * * *"

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Build manual/API onboarding report
        run: >-
          python scripts/build_manual_seed_onboarding_report.py
          --platforms "${{ inputs.platforms || 'facebook,instagram,threads,linkedin,x,newsletter' }}"
          --next-batch-limit "${{ inputs.next_batch_limit || '25' }}"
      - name: Commit onboarding report
        if: ${{ github.event_name == 'schedule' || inputs.commit_report == 'true' }}
        run: >-
          python scripts/commit_state_updates.py
          --message "Refresh manual API source onboarding report"
          --path conductor/manual_seed_onboarding_report.json
          --path conductor/manual_seed_onboarding_summary.md
          --path conductor/manual_seed_work_queue.json
          --path conductor/manual_seed_next_batch_templates.json
          --path conductor/manual_seed_drop_targets.md
