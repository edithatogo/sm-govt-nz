name: Archive YouTube Scheduled

on:
  schedule:
    - cron: "17 2 * * 0"
  workflow_dispatch:
    inputs:
      agency_id:
        description: "Optional agency ID filter"
        required: false
        default: ""
      dry_run:
        description: "Report without capturing"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      channel_limit:
        description: "Max channels to process per run"
        required: true
        default: "50"
        type: number

permissions:
  contents: write

jobs:
  archive-youtube:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install uv
        run: python -m pip install uv
      - name: Install runtime dependencies
        run: uv pip install --system -r requirements.txt
      - name: Archive YouTube sources
        run: |
          channel_limit="${{ inputs.channel_limit || '50' }}"
          args=(
            --source-type youtube
            --report conductor/youtube_archive_report.json
          )
          if [ "$channel_limit" != "0" ]; then
            args+=(--limit-sources "$channel_limit")
          fi
          if [ "${{ inputs.dry_run || 'false' }}" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ -n "${{ inputs.agency_id }}" ]; then
            args+=(--agency-id "${{ inputs.agency_id }}")
          fi
          python -m scripts.archive_registered_sources "${args[@]}"
      - name: Commit YouTube dry-run report
        if: ${{ inputs.dry_run == 'true' }}
        run: >-
          python scripts/commit_state_updates.py
          --message "Report YouTube government archive sources"
          --path conductor/youtube_archive_report.json
      - name: Commit YouTube capture reports
        if: ${{ inputs.dry_run != 'true' }}
        run: >-
          python scripts/commit_state_updates.py
          --message "Capture YouTube video metadata from registered government channels"
          --path conductor/youtube_archive_report.json
          --path conductor/archive_state.json
          --path conductor/archive_source_health.json
      - name: Commit YouTube payloads
        if: ${{ inputs.dry_run != 'true' }}
        run: >-
          python scripts/commit_state_updates.py
          --message "Archive YouTube normalized metadata payloads"
          --force
          --path 'historical_archive_raw/youtube/**'
          --path 'historical_archive_normalized/youtube/**'
