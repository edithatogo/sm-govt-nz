name: Archive Threads Scheduled

on:
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:
    inputs:
      agency_id:
        description: "Optional agency ID filter"
        required: false
        default: ""
      dry_run:
        description: "Report without capturing"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      commit_payloads:
        description: "Commit raw/normalized payloads to git"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write
  issues: write

concurrency:
  group: archive-state-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  archive-threads:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_API_BASE_URL: ${{ secrets.THREADS_API_BASE_URL || 'https://graph.threads.net/v1.0' }}
      THREADS_API_CAPTURE_ENABLED: ${{ vars.THREADS_API_CAPTURE_ENABLED || 'false' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"
      - name: Install uv
        run: python -m pip install uv
      - name: Install runtime dependencies
        run: uv pip install --system -r requirements.txt
      - name: Archive Threads sources
        run: |
          args=(
            --source-type threads
            --max-threads-posts 25
            --report conductor/threads_archive_report.json
          )
          if [ "${{ inputs.dry_run || 'false' }}" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ -n "${{ inputs.agency_id }}" ]; then
            args+=(--agency-id "${{ inputs.agency_id }}")
          fi
          python -m scripts.archive_registered_sources "${args[@]}"
      - name: Commit Threads capture reports
        if: ${{ inputs.dry_run != 'true' }}
        run: >-
          python scripts/commit_state_updates.py
          --message "Capture Threads posts from registered government accounts"
          --path conductor/threads_archive_report.json
          --path conductor/archive_state.json
          --path conductor/archive_source_health.json
      - name: Open Threads API blocker issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY' > /tmp/threads_issue_body.md
          import json
          from pathlib import Path

          report = json.loads(Path("conductor/threads_archive_report.json").read_text())
          blocked = [
              result for result in report.get("results", [])
              if result.get("status") in {"threads_permission_error", "threads_api_error"}
          ]
          if not blocked:
              raise SystemExit(0)
          print("# Threads archive API blocker")
          print()
          print(f"Generated at: {report.get('generated_at', '')}")
          print()
          print("The scheduled Threads archive workflow reached the Threads API but did not capture records for these registered sources:")
          print()
          for result in blocked:
              print(f"- `{result.get('source_id')}` `{result.get('status')}`: {result.get('reason', '')}")
          print()
          print("Next steps:")
          print()
          print("1. For live public Threads capture, deliberately complete Meta business verification and App Review for `threads_profile_discovery` on the app/token used by `THREADS_ACCESS_TOKEN`.")
          print("2. Otherwise, add operator-authorized seed exports under `manual_archive_seeds/threads/` for the registered sources.")
          print("3. Rerun `Archive Threads Scheduled` or `Archive Threads Manual Seeds`.")
          PY
          gh label create threads --color 4f46e5 --description "Threads platform archival work" || true
          gh label create archive-blocker --color b91c1c --description "Archive workflow blocker requiring operator action" || true
          existing="$(gh issue list --state open --label threads --label archive-blocker --json number --jq '.[0].number // empty')"
          if [ -s /tmp/threads_issue_body.md ] && [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file /tmp/threads_issue_body.md
          elif [ -s /tmp/threads_issue_body.md ]; then
            gh issue create \
              --title "Threads archive API access blocked" \
              --label threads \
              --label archive-blocker \
              --body-file /tmp/threads_issue_body.md
          elif [ -n "$existing" ]; then
            cat > /tmp/threads_api_close.md <<'EOF'
          # Threads API blocker: live capture disabled by default

          Threads sources are registered and monitored by scheduled workflows.

          Current state:
          - No Threads records are archived yet.
          - Live public Threads API capture is disabled unless `THREADS_API_CAPTURE_ENABLED=true` is deliberately configured.
          - Manual seeds remain the active automated capture path.
          - Missing seed inputs are tracked as `manual_seed_missing` in `conductor/threads_archive_report.json`.
          - Future authorized seed files or explicit API enablement will be handled automatically.

          This issue is closed because Meta API availability is now represented as an optional external capability, not a default repo blocker.
          EOF
            gh issue comment "$existing" --body-file /tmp/threads_api_close.md
            gh issue close "$existing" --reason completed
          fi
      - name: Commit Threads payloads
        if: ${{ inputs.dry_run != 'true' && inputs.commit_payloads == 'true' }}
        run: >-
          python scripts/commit_state_updates.py
          --message "Archive Threads raw and normalized payloads"
          --path 'historical_archive_raw/threads/**'
          --path 'historical_archive_normalized/threads/**'
