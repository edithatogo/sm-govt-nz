name: Issue Triage

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  issues: write
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Apply routing labels
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const title = issue.title.toLowerCase();
            const labels = new Set();
            if (title.startsWith('handle request:')) labels.add('registry');
            if (title.startsWith('upstream fix:')) labels.add('upstream');
            if (title.startsWith('bug:')) labels.add('bug');
            if (labels.size > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: [...labels],
              });
            }
      - name: Add issue to GitHub Project
        if: vars.PROJECT_NUMBER != '' && vars.PROJECT_OWNER != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECT_NUMBER: ${{ vars.PROJECT_NUMBER }}
          PROJECT_OWNER: ${{ vars.PROJECT_OWNER }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: gh project item-add "$PROJECT_NUMBER" --owner "$PROJECT_OWNER" --url "$ISSUE_URL"
