name: Archive Threads Manual Seeds

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish corpus after archiving seeds"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      publication_target:
        description: "External publication target when publish=true"
        required: true
        default: "all"
        type: choice
        options:
          - huggingface
          - zenodo
          - osf
          - all
          - all_with_osf
      commit_payloads:
        description: "Commit raw/normalized Threads payloads"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

concurrency:
  group: archive-state-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  archive-threads-seeds:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_DATASET_REPO_ID: ${{ secrets.HF_DATASET_REPO_ID }}
      HF_DATASET_NAME: corpus-social-media-government-nz
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
      ZENODO_DEPOSIT_ENDPOINT: ${{ secrets.ZENODO_DEPOSIT_ENDPOINT }}
      ZENODO_DEPOSIT_API_URL: ${{ secrets.ZENODO_DEPOSIT_ENDPOINT || 'https://zenodo.org/api/deposit/depositions' }}
      OSF_TOKEN: ${{ secrets.OSF_TOKEN }}
      OSF_UPLOAD_URL: ${{ secrets.OSF_UPLOAD_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install uv
        run: python -m pip install uv
      - name: Install runtime dependencies
        run: uv pip install --system -r requirements.txt
      - name: Build Threads seed readiness report
        run: python scripts/build_threads_seed_readiness_report.py
      - name: Validate Threads manual seeds
        run: python scripts/validate_threads_manual_seeds.py --allow-empty
      - name: Archive registered Threads sources
        run: >-
          python -m scripts.archive_registered_sources
          --source-type threads
      - name: Build archive compaction manifest
        run: >-
          python scripts/build_archive_compaction_manifest.py
          --normalized-dir historical_archive_normalized
          --raw-dir historical_archive_raw
          --output dist/archive_compaction_manifest.json
      - name: Check monthly publication guard
        id: monthly-publication
        run: >-
          python scripts/monthly_publication_guard.py
          --status-report conductor/archive_publication_status.json
          --release-version "$(date -u +'%Y-%m')"
      - name: Validate canonical publication status before bundling
        run: python scripts/validate_archive_publication_status.py
      - name: Bundle and optionally publish archive corpus
        run: |
          publish_target="artifact"
          status_report="dist/archive_publication_status_artifact.json"
          if [ "${{ inputs.publish }}" = "true" ] && [ "${{ steps.monthly-publication.outputs.should_publish }}" = "true" ]; then
            publish_target="${{ inputs.publication_target }}"
            status_report="conductor/archive_publication_status.json"
          elif [ "${{ inputs.publish }}" = "true" ]; then
            status_report="dist/archive_publication_status_skipped.json"
            echo "External publication already exists for ${{ steps.monthly-publication.outputs.release_version }}; building artifact only."
          fi
          args=(
            python scripts/publish_archives.py
            --archive-dir historical_archive
            --normalized-dir historical_archive_normalized
            --raw-dir historical_archive_raw
            --output-dir dist
            --manifest dist/archive_manifest.json
            --status-report "$status_report"
            --publish-target "$publish_target"
            --release-version "${{ steps.monthly-publication.outputs.release_version }}"
          )
          if [ "${{ inputs.publish }}" = "true" ] && [ "${{ steps.monthly-publication.outputs.should_publish }}" = "true" ]; then
            args+=(--publish)
          fi
          "${args[@]}"
      - name: Commit Threads seed archive reports
        run: >-
          python scripts/commit_state_updates.py
          --message "Archive Threads manual seed exports"
          --force
          --path conductor/threads_manual_seed_validation_report.json
          --path conductor/threads_seed_readiness_report.json
          --path conductor/threads_seed_readiness_summary.md
          --path conductor/govt_archive_registered_sources_report.json
          --path conductor/archive_state.json
          --path conductor/archive_source_health.json
          --path dist/archive_publication_status_artifact.json
          --path dist/archive_publication_status_skipped.json
          --path conductor/archive_publication_status.json
      - name: Commit published Threads corpus manifests
        if: ${{ inputs.publish == 'true' && steps.monthly-publication.outputs.should_publish == 'true' }}
        run: >-
          python scripts/commit_state_updates.py
          --message "Publish Threads manual seed archive corpus"
          --force
          --path conductor/archive_publication_status.json
          --path dist/archive_manifest.json
          --path dist/archive_compaction_manifest.json
          --path dist/corpus_manifest.json
          --path dist/README.md
      - name: Commit Threads seed payloads
        if: ${{ inputs.commit_payloads == 'true' }}
        run: |
          shopt -s globstar nullglob
          files=(historical_archive_raw/threads/** historical_archive_normalized/threads/**)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Threads seed payload files to commit."
            exit 0
          fi
          args=(
            python scripts/commit_state_updates.py
            --message "Archive Threads manual seed payloads"
            --force
          )
          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              args+=(--path "$file")
            fi
          done
          if [ "${#args[@]}" -eq 5 ]; then
            echo "No Threads seed payload files to commit."
            exit 0
          fi
          "${args[@]}"
      - name: Upload generated corpus bundle
        uses: actions/upload-artifact@v4
        with:
          name: threads-manual-seed-archive-corpus
          path: |
            dist/archive_manifest.json
            dist/archive_compaction_manifest.json
            conductor/archive_publication_status.json
            dist/archive_publication_status_artifact.json
            dist/archive_publication_status_skipped.json
            dist/corpus_manifest.json
            dist/README.md
            dist/historical_archive.tar.gz
            dist/historical_archive.jsonl.gz
            dist/normalized_archive.jsonl.gz
            dist/normalized_archive.parquet
