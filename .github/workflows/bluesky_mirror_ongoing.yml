name: Bluesky Mirror Ongoing

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Evaluate eligibility without posting."
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: bluesky-mirror-ongoing
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-python-uv
        with:
          requirements: requirements.txt
      - id: matrix
        run: python scripts/manage_bluesky_mirror_programme.py matrix --mode ongoing --github-output

  publish:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run == true) || vars.BLUESKY_MIRRORING_ENABLED == 'true' }}
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    concurrency:
      group: bluesky-mirror-${{ matrix.mirror_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-python-uv
        with:
          requirements: requirements.txt
      - env:
          BLUESKY_MIRRORING_ENABLED: ${{ inputs.dry_run == true && 'false' || vars.BLUESKY_MIRRORING_ENABLED }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: |
          args=(python scripts/manage_bluesky_mirror_programme.py publish --mode ongoing --mirror-id '${{ matrix.mirror_id }}')
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args+=(--dry-run)
          fi
          "${args[@]}"
      - run: python scripts/commit_state_updates.py --message "Update Bluesky mirror state" --path conductor/bluesky_mirror_runtime_state.json --path conductor/bluesky_mirror_post_audit.jsonl --path conductor/bluesky_mirror_dead_letter.jsonl --path conductor/bluesky_mirror_eligibility
