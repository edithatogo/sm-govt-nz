name: Validate Instagram

on:
  workflow_dispatch:

jobs:
  validate-instagram:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        run: python --version
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate Instagram secret shape
        run: python scripts/validate_secrets.py --mode syndicate --target instagram
      - name: Probe Instagram profile without posting
        run: python scripts/instagram_api_probe.py
