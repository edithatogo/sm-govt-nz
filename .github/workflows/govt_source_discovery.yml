name: Government Source Discovery

on:
  schedule:
    - cron: "31 16 * * *"
  workflow_dispatch:
    inputs:
      probe_homepages:
        description: "Fetch public agency pages while discovering candidates"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      max_agencies:
        description: "Maximum agencies to probe; 0 means all"
        required: true
        default: "0"

permissions:
  contents: write
  issues: write

jobs:
  discover:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Discover government source candidates
        run: |
          args=(--max-agencies "${{ inputs.max_agencies || '0' }}")
          if [ "${{ inputs.probe_homepages || 'true' }}" = "true" ]; then
            args+=(--probe-homepages)
          fi
          python scripts/discover_govt_source_candidates.py "${args[@]}"
      - name: Promote ready source candidates
        run: >-
          python scripts/promote_govt_source_candidates.py
          --report conductor/govt_source_candidate_report.json
          --manifest conductor/govt_archive_source_manifest.json
      - name: Commit discovery updates
        run: >-
          python scripts/commit_state_updates.py
          --message "Update government source discovery"
          --path conductor/govt_source_candidate_report.json
          --path conductor/govt_source_candidate_summary.md
          --path conductor/govt_archive_source_manifest.json
      - name: Build candidate review issue body
        id: candidate_issue
        run: >-
          python scripts/build_source_candidate_issue.py
          --body-output .tmp/source_candidate_issue.md
      - name: Create or update candidate review issue
        if: steps.candidate_issue.outputs.has_candidates == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: ${{ steps.candidate_issue.outputs.title }}
        run: |
          gh label create source-discovery \
            --repo "${{ github.repository }}" \
            --description "Source discovery candidates and review" \
            --color "0e8a16" \
            --force
          gh label create needs-review \
            --repo "${{ github.repository }}" \
            --description "Needs human review" \
            --color "fbca04" \
            --force
          existing_issue="$(
            gh issue list \
              --repo "${{ github.repository }}" \
              --state open \
              --label source-discovery \
              --json number,title \
              --jq ".[] | select(.title == env.ISSUE_TITLE) | .number" \
              | head -n 1
          )"
          if [ -n "${existing_issue}" ]; then
            gh issue edit "${existing_issue}" \
              --repo "${{ github.repository }}" \
              --body-file .tmp/source_candidate_issue.md
          else
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "${ISSUE_TITLE}" \
              --label source-discovery \
              --label needs-review \
              --body-file .tmp/source_candidate_issue.md
          fi
