name: Validate Buffer Syndication

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-buffer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.11
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Buffer CLI
        run: npm install -g @bufferapp/cli
      - name: Validate Buffer secrets
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_X_CHANNEL_ID: ${{ secrets.BUFFER_X_CHANNEL_ID }}
        run: python scripts/validate_secrets.py --mode syndicate --target x --env-file ""
      - name: Check Buffer account
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: buffer account --output json --quiet
      - name: Validate Buffer post command
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_X_CHANNEL_ID: ${{ secrets.BUFFER_X_CHANNEL_ID }}
        run: |
          buffer posts create \
            --scheduling-type automatic \
            --mode shareNow \
            --channel-id "$BUFFER_X_CHANNEL_ID" \
            --text "Buffer dry-run validation for sm-govt-nz." \
            --source sm-govt-nz \
            --output json \
            --quiet \
            --dry-run
