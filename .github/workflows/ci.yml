name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        run: python --version
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate CI secret schema
        run: python scripts/validate_secrets.py --mode ci
      - name: Ruff check
        run: ruff check --no-cache src tests scripts
      - name: Vale prose lint
        run: docker run --rm -v "$PWD:/work" -w /work jdkato/vale:latest SETUP_GUIDE.md docs conductor
      - name: Tests
        run: pytest -q
