name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
      fail-fast: false
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install uv
        continue-on-error: ${{ matrix.python-version == '3.14' }}
        run: python -m pip install uv
      - name: Install development dependencies
        continue-on-error: ${{ matrix.python-version == '3.14' }}
        run: uv pip install -r requirements-dev.txt
      - name: Validate CI secret schema
        continue-on-error: ${{ matrix.python-version == '3.14' }}
        run: python scripts/validate_secrets.py --mode ci
      - name: Ruff check
        continue-on-error: ${{ matrix.python-version == '3.14' }}
        run: ruff check --no-cache src tests scripts
      - name: Vale prose lint
        run: docker run --rm -v "$PWD:/work" -w /work jdkato/vale:latest SETUP_GUIDE.md docs conductor
      - name: Tests
        continue-on-error: ${{ matrix.python-version == '3.14' }}
        run: python -m pytest tests -q
