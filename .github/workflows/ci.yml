name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v5
      - name: Actionlint workflows
        uses: raven-actions/actionlint@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: "pip"
      - name: Install uv
        run: python -m pip install uv
      - name: Install development dependencies
        run: uv pip install --system -r requirements-dev.txt
      - name: Validate CI secret schema
        run: python scripts/validate_secrets.py --mode ci
      - name: Ruff check
        run: ruff check --no-cache src tests scripts
      - name: Vale prose lint
        run: docker run --rm -v "$PWD:/work" -w /work jdkato/vale:latest SETUP_GUIDE.md docs conductor
      - name: Tests
        run: python -m pytest tests -q
