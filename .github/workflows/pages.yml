name: Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: ./.github/actions/setup-python-uv
        with:
          requirements: requirements.txt
      - name: Bundle historical archive
        run: >-
          python scripts/publish_archives.py
          --archive-dir historical_archive
          --normalized-dir historical_archive_normalized
          --raw-dir historical_archive_raw
          --output-dir dist
          --manifest dist/archive_manifest.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
