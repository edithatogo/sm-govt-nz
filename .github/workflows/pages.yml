name: Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false
      - name: Set up Python
        uses: ./.github/actions/setup-python-uv
        with:
          requirements: requirements.txt
      - name: Hydrate migrated archive baseline from Hugging Face
        run: >-
          python scripts/migrate_git_lfs_to_huggingface.py hydrate
          --manifest conductor/huggingface_lfs_migration_manifest.json
          --source-root historical_archive_normalized
          --output-root dist/hydrated_archive_normalized
      - name: Bundle historical archive
        run: >-
          python scripts/publish_archives.py
          --archive-dir historical_archive
          --normalized-dir dist/hydrated_archive_normalized
          --raw-dir historical_archive_raw
          --output-dir dist
          --manifest dist/archive_manifest.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
