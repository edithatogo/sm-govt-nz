name: Archive Replay

on:
  workflow_dispatch:
    inputs:
      confirm_live_posting:
        description: "Type true to post archived records to the selected mirror."
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      target:
        description: "Mirror target"
        required: true
        default: "bluesky"
        type: choice
        options:
          - "bluesky"
      batch_limit:
        description: "Maximum archive records to post"
        required: true
        default: "10"
        type: choice
        options:
          - "5"
          - "10"
          - "20"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  archive-replay:
    if: ${{ inputs.confirm_live_posting == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        run: python --version
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate Bluesky mirror credentials
        env:
          BLUESKY_MIRROR_HANDLE: ${{ secrets.BLUESKY_MIRROR_HANDLE }}
          BLUESKY_MIRROR_APP_PASSWORD: ${{ secrets.BLUESKY_MIRROR_APP_PASSWORD }}
        run: python scripts/validate_secrets.py --mode syndicate --target bluesky
      - name: Probe Bluesky credentials
        env:
          BLUESKY_MIRROR_HANDLE: ${{ secrets.BLUESKY_MIRROR_HANDLE }}
          BLUESKY_MIRROR_APP_PASSWORD: ${{ secrets.BLUESKY_MIRROR_APP_PASSWORD }}
        run: python scripts/bluesky_api_probe.py
      - name: Run bounded X archive replay batch to Bluesky
        env:
          BLUESKY_MIRROR_HANDLE: ${{ secrets.BLUESKY_MIRROR_HANDLE }}
          BLUESKY_MIRROR_APP_PASSWORD: ${{ secrets.BLUESKY_MIRROR_APP_PASSWORD }}
        run: >-
          python scripts/post_archive_mirror_backlog.py
          --target ${{ inputs.target }}
          --limit ${{ inputs.batch_limit }}
      - name: Report archive mirror coverage
        run: python scripts/check_archive_mirror_coverage.py
      - name: Smoke check public Bluesky mirror
        run: python scripts/bluesky_mirror_smoke.py --actor mirnzcourts.bsky.social --min-posts 1
      - name: Verify archive mirror delivery URLs
        run: >-
          python scripts/verify_archive_mirror_posts.py
          --target ${{ inputs.target }}
          --limit ${{ inputs.batch_limit }}
      - name: Commit state updates
        run: >-
          python scripts/commit_state_updates.py
          --message "Update archive replay state"
          --path conductor/archive_mirror_state.json
          --path conductor/archive_mirror_coverage.json
