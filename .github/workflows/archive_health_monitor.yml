name: Archive Health Monitor

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install uv
        run: python -m pip install uv
      - name: Install runtime dependencies
        run: uv pip install --system -r requirements.txt
      - name: Check archive staleness
        id: staleness
        run: |
          python scripts/check_archive_staleness.py \
            --state-path conductor/archive_state.json \
            --health-path conductor/archive_source_health.json \
            --report-path conductor/archive_health_report.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
      - name: Report health status
        run: |
          python -c "
          import json
          r = json.load(open('conductor/archive_health_report.json'))
          s = r['summary']
          print(f'::notice title=Archive Health::{s[\"healthy_sources\"]} healthy, {s[\"stale_sources\"]} stale, {s[\"unknown_sources\"]} unknown')
          if s['stale_sources'] > 0 or s['unknown_sources'] > 0:
              for src in r['stale_sources']:
                  print(f'::warning title={src[\"status\"].upper()}::{src[\"agency_id\"]}/{src[\"source_type\"]} - {src[\"message\"]}')
          "
      - name: Commit health report
        run: >-
          python scripts/commit_state_updates.py
          --message "Record archive health monitor report"
          --path conductor/archive_health_report.json
      - name: Create GitHub Issue for stale sources
        if: steps.staleness.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('conductor/archive_health_report.json', 'utf8'));
            let body = `## Archive Staleness Detected\\n\\n`;
            body += `| Status | Agency | Source | Details |\\n`;
            body += `|---|---|---|---|\\n`;
            for (const src of report.stale_sources) {
              body += `| ${src.status} | ${src.agency_id} | ${src.source_type} | ${src.message} |\\n`;
            }
            body += `\\n---\\n`;
            body += `_Generated by archive_health_monitor.yml on ${report.generated_at}_\\n`;
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['archive-health'],
            });
            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: 'Archive Staleness Detected - Sources Missing Scheduled Captures',
                body: body,
                labels: ['archive-health'],
              });
            }
      - name: Upload health report
        uses: actions/upload-artifact@v4
        with:
          name: archive-health-report
          path: conductor/archive_health_report.json