name: Archive Historical Backlog

on:
  schedule:
    - cron: "19 3 2 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dispatch backlog shards in report-only mode"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      commit_payloads:
        description: "Ask child archive runs to commit raw/normalized payloads"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      include_blocked:
        description: "Ask child archive runs to include degraded/manual/blocked registered sources"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      batch_size:
        description: "Sources per child archive run"
        required: true
        default: "100"
      max_batches:
        description: "Maximum shard count per source type; 0 means all"
        required: true
        default: "0"
      source_types:
        description: "Comma-separated source types to fan out"
        required: true
        default: "rss,json_feed,api,bluesky,youtube,website_page,threads,x,linkedin,newsletter"
      release_version:
        description: "Optional monthly release version for HF publish, normally YYYY-MM"
        required: false
        default: ""
      publish_huggingface:
        description: "Trigger monthly publication after dispatch"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      publication_target:
        description: "External publication target when publish_huggingface=true"
        required: true
        default: "all"
        type: choice
        options:
          - huggingface
          - zenodo
          - osf
          - all
          - all_with_osf

permissions:
  actions: write
  contents: read

concurrency:
  group: historical-backlog-orchestrator-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-backlog-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      batch_count: ${{ steps.matrix.outputs.batch_count }}
      started_at: ${{ steps.started-at.outputs.started_at }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Record orchestrator start time
        id: started-at
        run: echo "started_at=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_OUTPUT"
      - name: Build exact backlog shard matrix
        id: matrix
        run: >-
          python scripts/build_historical_backlog_matrix.py
          --source-types "${{ inputs.source_types || 'rss,json_feed,api,bluesky,youtube,website_page,threads,x,linkedin,newsletter' }}"
          --batch-size "${{ inputs.batch_size || '100' }}"
          --max-batches "${{ inputs.max_batches || '0' }}"
          --output conductor/historical_backlog_matrix.json
          --github-output-key matrix
      - name: Upload backlog shard matrix
        uses: actions/upload-artifact@v4
        with:
          name: historical-backlog-shard-matrix
          path: conductor/historical_backlog_matrix.json

  dispatch-backlog-shards:
    needs: build-backlog-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.build-backlog-matrix.outputs.matrix) }}
    steps:
      - name: Dispatch source-type backlog shards
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_TYPE: ${{ matrix.source_type }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          COMMIT_PAYLOADS: ${{ inputs.commit_payloads || 'true' }}
          INCLUDE_BLOCKED: ${{ inputs.include_blocked || 'true' }}
          LIMIT: ${{ matrix.limit }}
          OFFSET: ${{ matrix.offset }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          echo "Dispatching $SOURCE_TYPE backlog shard offset=$OFFSET limit=$LIMIT"
          gh workflow run "Archive Registered Sources" \
            --repo "$REPOSITORY" \
            --ref "$REF_NAME" \
            -f source_type="$SOURCE_TYPE" \
            -f dry_run="$DRY_RUN" \
            -f include_blocked="$INCLUDE_BLOCKED" \
            -f limit_sources="$LIMIT" \
            -f offset_sources="$OFFSET" \
            -f commit_payloads="$COMMIT_PAYLOADS" \
            -f publish=false

  wait-for-backlog-shards:
    needs:
      - build-backlog-matrix
      - dispatch-backlog-shards
    runs-on: ubuntu-latest
    steps:
      - name: Wait for dispatched archive shard runs
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_COUNT: ${{ needs.build-backlog-matrix.outputs.batch_count }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          STARTED_AT: ${{ needs.build-backlog-matrix.outputs.started_at }}
        shell: bash
        run: |
          if [ "$EXPECTED_COUNT" = "0" ]; then
            echo "No backlog shards were dispatched."
            exit 0
          fi
          deadline=$((SECONDS + 5400))
          while [ "$SECONDS" -lt "$deadline" ]; do
            gh run list \
              --repo "$REPOSITORY" \
              --workflow "Archive Registered Sources" \
              --branch "$REF_NAME" \
              --limit 100 \
              --json databaseId,status,conclusion,headSha,createdAt,url > runs.json
            python - <<'PY' > shard-status.env
          import json
          import os
          from datetime import datetime, timezone

          expected = int(os.environ["EXPECTED_COUNT"])
          head_sha = os.environ["HEAD_SHA"]
          started_at = datetime.fromisoformat(os.environ["STARTED_AT"].replace("Z", "+00:00"))
          runs = json.load(open("runs.json", encoding="utf-8"))
          matched = []
          for run in runs:
              if run.get("headSha") != head_sha:
                  continue
              created = datetime.fromisoformat(str(run.get("createdAt")).replace("Z", "+00:00"))
              if created >= started_at:
                  matched.append(run)
          completed = [run for run in matched if run.get("status") == "completed"]
          failed = [run for run in completed if run.get("conclusion") != "success"]
          print(f"matched={len(matched)}")
          print(f"completed={len(completed)}")
          print(f"failed={len(failed)}")
          print(f"expected={expected}")
          if failed:
              print("failed_urls=" + ",".join(str(run.get("url")) for run in failed))
          PY
            cat shard-status.env
            # shellcheck disable=SC1091
            source shard-status.env
            if [ "$failed" != "0" ]; then
              echo "One or more backlog shard runs failed: ${failed_urls:-}"
              exit 1
            fi
            if [ "$matched" -ge "$EXPECTED_COUNT" ] && [ "$completed" -ge "$EXPECTED_COUNT" ]; then
              echo "All dispatched backlog shard runs completed successfully."
              exit 0
            fi
            sleep 60
          done
          echo "Timed out waiting for backlog shard runs."
          exit 1

  dispatch-monthly-publish:
    needs: wait-for-backlog-shards
    if: ${{ github.event_name == 'schedule' || inputs.publish_huggingface == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve release version
        id: release
        shell: bash
        run: |
          version="${{ inputs.release_version }}"
          if [ -z "$version" ]; then
            version="$(date -u +"%Y-%m")"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Dispatch HF-only monthly publication
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: >-
          gh workflow run "Publish Archives"
          --repo "$REPOSITORY"
          --ref "$REF_NAME"
          -f publish=true
          -f publication_target="${{ inputs.publication_target || 'all' }}"
          -f archive_release_version="${{ steps.release.outputs.version }}"
          -f hf_dataset_name=corpus-social-media-government-nz
          -f zenodo_deposit_api_url=https://zenodo.org/api/deposit/depositions
