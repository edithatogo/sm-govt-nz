name: Update Registry

on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.11
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Generate gap analysis
        run: python scripts/gap_analyzer.py --registry registry/agencies.json --output registry/gap_analysis.json
      - name: Compile registry to SQLite
        run: python scripts/compile_registry.py
      - name: Verify registry compilation
        run: python scripts/verify_registry_compilation.py --json registry/government_directory.json --db registry/government_directory.db --output registry/verification_report.json
      - name: Run self-evaluation
        run: python scripts/self_eval.py --output agent_framework/evaluations/latest.json
      - name: Commit generated registry outputs
        run: >-
          python scripts/commit_state_updates.py
          --message "Update agency registry analysis"
          --path registry/gap_analysis.json
          --path registry/compiled/agencies.json
          --path registry/government_directory.db
          --path registry/verification_report.json
          --path agent_framework/evaluations/latest.json
