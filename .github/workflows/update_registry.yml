name: Update Registry

on:
  schedule:
    - cron: "0 18 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.11
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Generate gap analysis
        run: python scripts/gap_analyzer.py --registry registry/agencies.json --output registry/gap_analysis.json
      - name: Run self-evaluation
        run: python scripts/self_eval.py --output agent_framework/evaluations/latest.json
      - name: Commit generated registry outputs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Update agency registry analysis
          file_pattern: registry/gap_analysis.json agent_framework/evaluations/latest.json
