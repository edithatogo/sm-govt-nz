name: Bluesky Mirror Historical Backfill

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bluesky-mirror-backfill
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-python-uv
        with:
          requirements: requirements.txt
      - id: matrix
        run: python scripts/manage_bluesky_mirror_programme.py matrix --mode backfill --github-output

  publish:
    if: ${{ vars.BLUESKY_MIRRORING_ENABLED == 'true' }}
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-python-uv
        with:
          requirements: requirements.txt
      - env:
          BLUESKY_MIRRORING_ENABLED: ${{ vars.BLUESKY_MIRRORING_ENABLED }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: python scripts/manage_bluesky_mirror_programme.py publish --mode backfill --mirror-id '${{ matrix.mirror_id }}'
      - run: python scripts/commit_state_updates.py --message "Update Bluesky backfill state" --path conductor/bluesky_mirror_runtime_state.json --path conductor/bluesky_mirror_post_audit.jsonl --path conductor/bluesky_mirror_dead_letter.jsonl --path conductor/bluesky_mirror_eligibility
