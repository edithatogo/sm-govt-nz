name: Bluesky Mirror Historical Backfill

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      mirror_id:
        description: "Canonical mirror ID. Required for manual runs."
        required: true
        type: string
      dry_run:
        description: "Evaluate eligibility without posting."
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: bluesky-mirror-backfill
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-python-uv
        with:
          requirements: requirements.txt
      - id: matrix
        env:
          MIRROR_ID: ${{ inputs.mirror_id }}
        run: python scripts/manage_bluesky_mirror_programme.py matrix --mode backfill --mirror-id "$MIRROR_ID" --github-output
      - env:
          SELECTED_MATRIX: ${{ steps.matrix.outputs.matrix }}
        run: |
          {
            echo "## Selected mirror matrix"
            echo '```json'
            echo "$SELECTED_MATRIX"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run == true) || vars.BLUESKY_MIRRORING_ENABLED == 'true' }}
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    concurrency:
      group: bluesky-mirror-${{ matrix.mirror_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-python-uv
        with:
          requirements: requirements.txt
      - env:
          BLUESKY_MIRRORING_ENABLED: ${{ inputs.dry_run == true && 'false' || vars.BLUESKY_MIRRORING_ENABLED }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run }}
          MIRROR_ID: ${{ matrix.mirror_id }}
        run: |
          args=(python scripts/manage_bluesky_mirror_programme.py publish --mode backfill --mirror-id "$MIRROR_ID")
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          "${args[@]}"
      - run: python scripts/commit_state_updates.py --message "Update Bluesky backfill state (${{ matrix.mirror_id }})" --path "conductor/bluesky_mirror_state/${{ matrix.mirror_id }}.json" --path "conductor/bluesky_mirror_audit/${{ matrix.mirror_id }}.jsonl" --path "conductor/bluesky_mirror_dead_letter/${{ matrix.mirror_id }}.jsonl" --path "conductor/bluesky_mirror_eligibility/${{ matrix.mirror_id }}.json"
