name: Buffer Key Rotation Reminder

on:
  schedule:
    - cron: "13 20 * * *"
  workflow_dispatch:
    inputs:
      expires_on:
        description: Current Buffer API key expiry date.
        required: false
        default: "2026-07-12"

permissions:
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  remind:
    runs-on: ubuntu-latest
    env:
      BUFFER_API_KEY_EXPIRES_ON: ${{ github.event.inputs.expires_on || '2026-07-12' }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        run: python --version
      - name: Check rotation window
        id: rotation
        run: >-
          python scripts/check_buffer_key_rotation.py
          --expires-on "$BUFFER_API_KEY_EXPIRES_ON"
          --warn-days 30
          --critical-days 7
          --issue-body-output .tmp/buffer_key_rotation_issue.md
          --github-output "$GITHUB_OUTPUT"
      - name: Create or update reminder issue
        if: steps.rotation.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: ${{ steps.rotation.outputs.issue_title }}
        run: |
          existing_issue="$(
            gh issue list \
              --state open \
              --search "$ISSUE_TITLE in:title" \
              --json number \
              --jq '.[0].number // ""'
          )"
          if [ -n "$existing_issue" ]; then
            gh issue comment "$existing_issue" --body-file .tmp/buffer_key_rotation_issue.md
          else
            gh issue create --title "$ISSUE_TITLE" --body-file .tmp/buffer_key_rotation_issue.md
          fi
      - name: Close resolved reminder issue
        if: steps.rotation.outputs.due == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: ${{ steps.rotation.outputs.issue_title }}
        run: |
          existing_issue="$(
            gh issue list \
              --state open \
              --search "$ISSUE_TITLE in:title" \
              --json number \
              --jq '.[0].number // ""'
          )"
          if [ -n "$existing_issue" ]; then
            gh issue comment "$existing_issue" --body "Buffer API key rotation is no longer due after validation passed outside the warning window. Closing this reminder."
            gh issue close "$existing_issue" --reason completed
          fi
