name: Mirror Sync

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Mirror to Secondary Git Remote
        env:
          GIT_MIRROR_URL: ${{ secrets.GIT_MIRROR_URL }}
          GIT_MIRROR_SSH_PRIVATE_KEY: ${{ secrets.GIT_MIRROR_SSH_PRIVATE_KEY }}
        run: |
          if [ -z "$GIT_MIRROR_URL" ]; then
            echo "GIT_MIRROR_URL is not set, skipping mirror."
            exit 0
          fi
          if [ -z "$GIT_MIRROR_SSH_PRIVATE_KEY" ]; then
            echo "GIT_MIRROR_SSH_PRIVATE_KEY is not set, skipping mirror."
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$GIT_MIRROR_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          HOST=$(echo "$GIT_MIRROR_URL" | cut -d'@' -f2 | cut -d':' -f1)
          ssh-keyscan -t ed25519 "$HOST" >> ~/.ssh/known_hosts
          git remote add mirror "$GIT_MIRROR_URL"
          git push --force --prune mirror master
      - name: Validate mirror branch alignment
        env:
          GIT_MIRROR_URL: ${{ secrets.GIT_MIRROR_URL }}
        run: |
          if [ -z "$GIT_MIRROR_URL" ]; then
            echo "GIT_MIRROR_URL is not set, skipping mirror validation."
            exit 0
          fi
          python scripts/validate_git_mirrors.py --branch master --compare-head --output mirror_validation_report.json
      - name: Upload mirror validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirror-validation-report
          path: mirror_validation_report.json
          if-no-files-found: ignore
