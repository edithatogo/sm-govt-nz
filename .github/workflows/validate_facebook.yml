name: Validate Facebook

on:
  workflow_dispatch:

jobs:
  validate-facebook:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        run: python --version
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate Facebook secret shape
        run: python scripts/validate_secrets.py --mode syndicate --target facebook
      - name: Probe Facebook Page without posting
        run: python scripts/facebook_page_probe.py
