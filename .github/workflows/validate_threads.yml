name: Validate Threads

on:
  workflow_dispatch:

jobs:
  validate-threads:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        run: python --version
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate Threads secret shape
        run: python scripts/validate_secrets.py --mode syndicate --target threads
      - name: Probe Threads profile without posting
        run: python scripts/threads_api_probe.py
