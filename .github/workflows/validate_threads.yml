name: Validate Threads

on:
  workflow_dispatch:

jobs:
  validate-threads:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
      THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install uv
        run: python -m pip install uv
      - name: Install runtime dependencies
        run: uv pip install --system -r requirements.txt
      - name: Validate Threads secret shape
        run: python scripts/validate_secrets.py --mode syndicate --target threads
      - name: Probe Threads profile without posting
        run: python scripts/threads_api_probe.py
