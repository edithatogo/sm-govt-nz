name: Threads Launch

on:
  workflow_dispatch:
    inputs:
      confirm_live_posting:
        description: "Type true to publish the latest configured source post to Threads."
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  threads-launch:
    if: ${{ inputs.confirm_live_posting == 'true' }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        run: python --version
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate Threads syndication secrets
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: python scripts/validate_secrets.py --mode syndicate --target threads
      - name: Probe Threads credentials
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: python scripts/threads_api_probe.py
      - name: Check Threads pipeline gate
        run: python scripts/check_threads_pipeline.py
      - name: Preview latest Threads payload
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: python scripts/post_threads_latest.py
      - name: Publish latest post to Threads
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: python scripts/post_threads_latest.py --confirm-live-posting
      - name: Commit Threads delivery state
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Update Threads launch delivery state
          file_pattern: conductor/target_delivery_state.json
