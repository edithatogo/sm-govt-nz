name: Publish Zenodo Deposition

on:
  workflow_dispatch:
    inputs:
      deposition_id:
        description: Existing Zenodo draft deposition ID to publish.
        required: true
        default: "20690547"
        type: string
      confirm:
        description: Type publish-zenodo-doi to publish the DOI.
        required: true
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Publish Zenodo draft deposition
        run: >-
          python scripts/publish_zenodo_deposition.py
          --deposition-id "${{ inputs.deposition_id }}"
          --confirm "${{ inputs.confirm }}"
      - name: Commit publication report
        run: >-
          python scripts/commit_state_updates.py
          --message "Record Zenodo DOI publication"
          --path conductor/archive_publication_report_20260614.json
