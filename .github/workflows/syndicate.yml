name: Syndicate

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      confirm_live_posting:
        description: "Type true to run live syndication."
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  syndicate:
    if: ${{ github.event_name == 'schedule' || inputs.confirm_live_posting == 'true' }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        run: python --version
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate syndication secrets
        env:
          BLUESKY_MIRROR_HANDLE: ${{ secrets.BLUESKY_MIRROR_HANDLE }}
          BLUESKY_MIRROR_APP_PASSWORD: ${{ secrets.BLUESKY_MIRROR_APP_PASSWORD }}
        run: python scripts/validate_secrets.py --mode syndicate --target bluesky
      - name: Probe Bluesky credentials
        env:
          BLUESKY_MIRROR_HANDLE: ${{ secrets.BLUESKY_MIRROR_HANDLE }}
          BLUESKY_MIRROR_APP_PASSWORD: ${{ secrets.BLUESKY_MIRROR_APP_PASSWORD }}
        run: python scripts/bluesky_api_probe.py
      - name: Validate Threads syndication secrets
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: python scripts/validate_secrets.py --mode syndicate --target threads
      - name: Probe Threads credentials
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: python scripts/threads_api_probe.py
      - name: Run syndicator
        env:
          BLUESKY_MIRROR_HANDLE: ${{ secrets.BLUESKY_MIRROR_HANDLE }}
          BLUESKY_MIRROR_APP_PASSWORD: ${{ secrets.BLUESKY_MIRROR_APP_PASSWORD }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: python -m src.runner
      - name: Run Bluesky historical backlog batch
        env:
          BLUESKY_MIRROR_HANDLE: ${{ secrets.BLUESKY_MIRROR_HANDLE }}
          BLUESKY_MIRROR_APP_PASSWORD: ${{ secrets.BLUESKY_MIRROR_APP_PASSWORD }}
        run: python scripts/post_bluesky_backlog.py
      - name: Run X archive replay batch to Bluesky
        env:
          BLUESKY_MIRROR_HANDLE: ${{ secrets.BLUESKY_MIRROR_HANDLE }}
          BLUESKY_MIRROR_APP_PASSWORD: ${{ secrets.BLUESKY_MIRROR_APP_PASSWORD }}
        run: python scripts/post_archive_mirror_backlog.py --target bluesky
      - name: Check Threads pipeline gate
        run: python scripts/check_threads_pipeline.py
      - name: Report archive mirror coverage
        run: python scripts/check_archive_mirror_coverage.py
      - name: Smoke check public Bluesky mirror
        run: python scripts/bluesky_mirror_smoke.py --actor mirnzcourts.bsky.social --min-posts 1
      - name: Commit state updates
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: Update syndication state
          file_pattern: conductor/state.json conductor/target_delivery_state.json conductor/bluesky_backlog_state.json conductor/archive_mirror_state.json conductor/archive_mirror_coverage.json historical_archive/**
