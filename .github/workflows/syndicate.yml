name: Syndicate

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      confirm_live_posting:
        description: "Type true to run live syndication."
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

jobs:
  syndicate:
    if: ${{ github.event_name == 'schedule' || inputs.confirm_live_posting == 'true' }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install uv
        run: python -m pip install uv
      - name: Install runtime dependencies
        run: uv pip install --system -r requirements.txt
      - name: Install Buffer CLI
        continue-on-error: ${{ github.event_name == 'schedule' }}
        run: npm install -g @bufferapp/cli
      - name: Validate syndication secrets
        env:
          BLUESKY_MIRROR_HANDLE: ${{ secrets.BLUESKY_MIRROR_HANDLE }}
          BLUESKY_MIRROR_APP_PASSWORD: ${{ secrets.BLUESKY_MIRROR_APP_PASSWORD }}
        run: python scripts/validate_secrets.py --mode syndicate --target bluesky
      - name: Probe Bluesky credentials
        env:
          BLUESKY_MIRROR_HANDLE: ${{ secrets.BLUESKY_MIRROR_HANDLE }}
          BLUESKY_MIRROR_APP_PASSWORD: ${{ secrets.BLUESKY_MIRROR_APP_PASSWORD }}
        run: python scripts/bluesky_api_probe.py
      - name: Validate Threads syndication secrets
        id: validate_threads
        continue-on-error: true
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: python scripts/validate_secrets.py --mode syndicate --target threads
      - name: Probe Threads credentials
        id: probe_threads
        continue-on-error: true
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: python scripts/threads_api_probe.py
      - name: Validate Buffer X syndication secrets
        id: validate_buffer_x
        continue-on-error: ${{ github.event_name == 'schedule' }}
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_X_CHANNEL_ID: ${{ secrets.BUFFER_X_CHANNEL_ID }}
        run: python scripts/validate_secrets.py --mode syndicate --target x --env-file ""
      - name: Probe Buffer account
        id: probe_buffer_x
        continue-on-error: ${{ github.event_name == 'schedule' }}
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: buffer account --output json --quiet
      - name: Report skipped live syndication
        if: >-
          ${{
            github.event_name == 'schedule' &&
            (
              steps.validate_threads.outcome != 'success' ||
              steps.probe_threads.outcome != 'success'
            )
          }}
        run: |
          echo "::warning::Skipping live new-post syndication because Threads credentials did not validate. Historical backlog/archive tasks will continue."
      - name: Run syndicator
        env:
          BLUESKY_MIRROR_HANDLE: ${{ secrets.BLUESKY_MIRROR_HANDLE }}
          BLUESKY_MIRROR_APP_PASSWORD: ${{ secrets.BLUESKY_MIRROR_APP_PASSWORD }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_X_CHANNEL_ID: ${{ secrets.BUFFER_X_CHANNEL_ID }}
        run: python -m src.runner
      - name: Run Bluesky historical backlog batch
        env:
          BLUESKY_MIRROR_HANDLE: ${{ secrets.BLUESKY_MIRROR_HANDLE }}
          BLUESKY_MIRROR_APP_PASSWORD: ${{ secrets.BLUESKY_MIRROR_APP_PASSWORD }}
        run: python scripts/post_bluesky_backlog.py
      - name: Run X archive replay batch to Bluesky
        env:
          BLUESKY_MIRROR_HANDLE: ${{ secrets.BLUESKY_MIRROR_HANDLE }}
          BLUESKY_MIRROR_APP_PASSWORD: ${{ secrets.BLUESKY_MIRROR_APP_PASSWORD }}
        run: python scripts/post_archive_mirror_backlog.py --target bluesky
      - name: Check Threads pipeline gate
        run: python scripts/check_threads_pipeline.py
      - name: Report archive mirror coverage
        run: python scripts/check_archive_mirror_coverage.py
      - name: Smoke check public Bluesky mirror
        run: python scripts/bluesky_mirror_smoke.py --actor mirnzcourts.bsky.social --min-posts 1
      - name: Verify archive mirror delivery URLs
        run: python scripts/verify_archive_mirror_posts.py --target bluesky --limit 5
      - name: Commit state updates
        run: >-
          python scripts/commit_state_updates.py
          --message "Update syndication state"
          --path conductor/state.json
          --path conductor/target_delivery_state.json
          --path conductor/bluesky_backlog_state.json
          --path conductor/archive_mirror_state.json
          --path conductor/archive_mirror_coverage.json
          --path 'historical_archive/**'
