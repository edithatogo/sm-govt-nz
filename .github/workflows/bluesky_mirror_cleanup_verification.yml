name: Bluesky Mirror Cleanup Verification

on:
  schedule:
    - cron: "53 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-python-uv
        with:
          requirements: requirements.txt
      - id: matrix
        run: python scripts/manage_bluesky_mirror_programme.py matrix --mode health --github-output

  verify:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    concurrency:
      group: bluesky-mirror-cleanup-verification-${{ matrix.mirror_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-python-uv
        with:
          requirements: requirements.txt
      - run: python scripts/verify_archive_mirror_posts.py --reconcile-programme --mirror-id '${{ matrix.mirror_id }}' --audit-path conductor/bluesky_mirror_post_audit.jsonl --audit-path conductor/bluesky_mirror_audit --output 'conductor/bluesky_mirror_cleanup/${{ matrix.mirror_id }}.json' --json
      - run: python scripts/commit_state_updates.py --message "Refresh Bluesky cleanup verification (${{ matrix.mirror_id }})" --path "conductor/bluesky_mirror_cleanup/${{ matrix.mirror_id }}.json"
