name: Bluesky Mirror Health

on:
  schedule:
    - cron: "41 10 * * *"
  workflow_dispatch:
    inputs:
      mirror_id:
        description: "Canonical mirror ID. Required for manual runs."
        required: true
        type: string

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      selected_matrix: ${{ steps.matrix.outputs.selected_matrix }}
      has_targets: ${{ steps.matrix.outputs.has_targets }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-python-uv
        with:
          requirements: requirements.txt
      - id: matrix
        env:
          MIRROR_ID: ${{ inputs.mirror_id }}
        run: python scripts/manage_bluesky_mirror_programme.py matrix --mode health --mirror-id "$MIRROR_ID" --github-output
      - env:
          SELECTED_MATRIX: ${{ steps.matrix.outputs.selected_matrix }}
        run: |
          {
            echo "## Selected mirror matrix"
            echo '```json'
            echo "$SELECTED_MATRIX"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  no-eligible-mirrors:
    needs: plan
    if: ${{ needs.plan.outputs.has_targets != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "No eligible configured mirror matched this health request."
  credential-health:
    needs: plan
    if: ${{ needs.plan.outputs.has_targets == 'true' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    concurrency:
      group: bluesky-mirror-health-${{ matrix.mirror_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-python-uv
        with:
          requirements: requirements.txt
      - env:
          BLUESKY_CREDENTIAL_MODE: app_password
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: |
          python scripts/manage_bluesky_mirror_programme.py credential-health --mirror-id '${{ matrix.mirror_id }}' --output 'conductor/bluesky_mirror_credential_health/${{ matrix.mirror_id }}.json'
          python scripts/manage_bluesky_mirror_programme.py preflight --mirror-id '${{ matrix.mirror_id }}'
      - run: python scripts/commit_state_updates.py --message "Refresh Bluesky credential health (${{ matrix.mirror_id }})" --path "conductor/bluesky_mirror_credential_health/${{ matrix.mirror_id }}.json"

  public-health:
    needs: plan
    if: ${{ needs.plan.outputs.has_targets == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: bluesky-mirror-public-health
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-python-uv
        with:
          requirements: requirements.txt
      - run: python scripts/manage_bluesky_mirror_programme.py health --fail-on-fault
      - run: python scripts/manage_bluesky_mirror_handle.py monitor-retired --fail-on-actionable
      - run: python scripts/commit_state_updates.py --message "Refresh Bluesky mirror health" --path conductor/bluesky_mirror_health_report.json
      - run: python scripts/commit_state_updates.py --message "Refresh retired Bluesky handle health" --path conductor/bluesky_retired_handle_report.json
  observation:
    needs:
      - plan
      - credential-health
      - public-health
    if: ${{ always() && github.event_name == 'schedule' && needs.plan.result == 'success' && needs.credential-health.result == 'success' && needs.public-health.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-python-uv
        with:
          requirements: requirements.txt
      - name: Record successful daily observation
        env:
          SELECTED_MATRIX: ${{ needs.plan.outputs.selected_matrix }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          OBSERVED_AT="$(date --utc +%Y-%m-%dT%H:%M:%SZ)"
          python scripts/record_bluesky_mirror_observation.py record \
            --selected-matrix-json "$SELECTED_MATRIX" \
            --observed-at "$OBSERVED_AT" \
            --repository "$REPOSITORY" \
            --workflow "$WORKFLOW_NAME" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --commit-sha "$COMMIT_SHA" \
            --output-dir conductor/bluesky_mirror_observations
          python scripts/record_bluesky_mirror_observation.py evaluate \
            --policy conductor/bluesky_mirror_observation_policy.json \
            --receipts conductor/bluesky_mirror_observations \
            --evaluated-at "$OBSERVED_AT" \
            --output conductor/bluesky_mirror_observation_status.json
          python scripts/build_bluesky_mirror_hosted_plan.py
          python scripts/close_bluesky_mirror_observation.py --apply-if-ready
      - run: |
          python scripts/commit_state_updates.py \
            --message "Record Bluesky mirror observation (${{ github.run_id }})" \
            --path conductor/bluesky_mirror_observations \
            --path conductor/bluesky_mirror_observation_status.json \
            --path conductor/bluesky_mirror_hosted_dry_run_plan.json \
            --path conductor/tracks.md \
            --path conductor/tracks \
            --path conductor/archive/bluesky_mirror_reliability_hardening_20260724
