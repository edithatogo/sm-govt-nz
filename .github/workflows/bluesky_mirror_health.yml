name: Bluesky Mirror Health

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:
    inputs:
      mirror_id:
        description: "Canonical mirror ID. Required for manual runs."
        required: true
        type: string

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-python-uv
        with:
          requirements: requirements.txt
      - id: matrix
        env:
          MIRROR_ID: ${{ inputs.mirror_id }}
        run: python scripts/manage_bluesky_mirror_programme.py matrix --mode health --mirror-id "$MIRROR_ID" --github-output
      - env:
          SELECTED_MATRIX: ${{ steps.matrix.outputs.matrix }}
        run: |
          {
            echo "## Selected mirror matrix"
            echo '```json'
            echo "$SELECTED_MATRIX"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  credential-health:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    concurrency:
      group: bluesky-mirror-health-${{ matrix.mirror_id }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-python-uv
        with:
          requirements: requirements.txt
      - env:
          BLUESKY_CREDENTIAL_MODE: app_password
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: |
          python scripts/manage_bluesky_mirror_programme.py credential-health --mirror-id '${{ matrix.mirror_id }}' --output 'conductor/bluesky_mirror_credential_health/${{ matrix.mirror_id }}.json'
          python scripts/manage_bluesky_mirror_programme.py preflight --mirror-id '${{ matrix.mirror_id }}'
      - run: python scripts/commit_state_updates.py --message "Refresh Bluesky credential health (${{ matrix.mirror_id }})" --path "conductor/bluesky_mirror_credential_health/${{ matrix.mirror_id }}.json"

  public-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-python-uv
        with:
          requirements: requirements.txt
      - run: python scripts/manage_bluesky_mirror_programme.py health
      - run: python scripts/manage_bluesky_mirror_handle.py monitor-retired --fail-on-actionable
      - run: python scripts/commit_state_updates.py --message "Refresh Bluesky mirror health" --path conductor/bluesky_mirror_health_report.json
      - run: python scripts/commit_state_updates.py --message "Refresh retired Bluesky handle health" --path conductor/bluesky_retired_handle_report.json
