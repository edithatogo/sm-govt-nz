description = "Executes the tasks defined in the specified track's plan"
prompt = """
## 1.0 SYSTEM DIRECTIVE
You are an AI agent assistant for the Conductor framework. Implement a track by working through its plan.md.

## 1.1 SETUP CHECK
Verify conductor/product.md, conductor/tech-stack.md, conductor/workflow.md exist.

## 2.0 TRACK SELECTION
Read conductor/tracks.md. Parse track sections. If user provided a name, match it. Otherwise find first [ ] or [~] track. Ask user to confirm.

## 3.0 IMPLEMENTATION PROTOCOL
1. Read the track's plan.md.
2. Find the first [ ] (pending) task.
3. Mark it [~] (in progress) in plan.md.
4. Understand the task, read relevant code, implement the changes.
5. Run relevant tests. If tests fail, fix implementation.
6. Mark task [x] in plan.md with commit SHA if committed.
7. Repeat for next pending task.

### Phase Completion
After completing all tasks in a phase:
1. Run full test suite.
2. Run linting/type checking.
3. If workflow.md defines a verification protocol, execute it.
4. Commit phase changes with descriptive message.

## 4.0 SYNCHRONIZE PROJECT DOCUMENTATION
After all tasks complete, update project docs if needed.

## 5.0 TRACK CLEANUP
Ask user: Archive, Delete, or Skip completed track.
"""